<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Carnet PEA</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f64bd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carnet PEA">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
/* Carnet PEA — thème clair / sombre par jetons. Mobile d'abord. */
:root {
  --bg: #f2f5f3; --surface: #ffffff; --surface-2: #e9eeeb; --ink: #14201c; --ink-2: #485853; --ink-3: #74837e;
  --line: #dce3df; --line-2: #c5cecA; --grid: #e4e9e6; --axis: #c3cbc7;
  --accent: #2a78d6; --accent-soft: #e2edfa; --btn-bg: #1f64bd; --btn-ink: #ffffff;
  --good: #006300; --good-soft: #e0f1e0; --bad: #c22f2f; --bad-soft: #fbe6e6; --warn: #86570a; --warn-soft: #fcefcf;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c8: #e34948; --other: #98a5a0;
  --shadow: 0 1px 2px rgba(20, 32, 28, .06), 0 8px 24px rgba(20, 32, 28, .08);
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1311; --surface: #151c19; --surface-2: #1e2824; --ink: #e8efec; --ink-2: #b2c0ba; --ink-3: #88978f;
    --line: #26312d; --line-2: #35423d; --grid: #222c28; --axis: #35423d;
    --accent: #3987e5; --accent-soft: #14263c; --btn-bg: #3987e5; --btn-ink: #06142a;
    --good: #2bb52b; --good-soft: #14301a; --bad: #ec7272; --bad-soft: #3a1d1d; --warn: #e3b043; --warn-soft: #382d12;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767; --other: #66746e;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1311; --surface: #151c19; --surface-2: #1e2824; --ink: #e8efec; --ink-2: #b2c0ba; --ink-3: #88978f;
  --line: #26312d; --line-2: #35423d; --grid: #222c28; --axis: #35423d;
  --accent: #3987e5; --accent-soft: #14263c; --btn-bg: #3987e5; --btn-ink: #06142a;
  --good: #2bb52b; --good-soft: #14301a; --bad: #ec7272; --bad-soft: #3a1d1d; --warn: #e3b043; --warn-soft: #382d12;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767; --other: #66746e;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 96px; -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, p { margin: 0; }
h2 { font-size: 17px; font-weight: 600; letter-spacing: -.005em; }
h3 { font-size: 15px; font-weight: 600; }
.muted { color: var(--ink-3); }
.soft { color: var(--ink-2); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.right { text-align: right; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.up { color: var(--good); } .dn { color: var(--bad); } .wn { color: var(--warn); }

.app { max-width: 1040px; margin: 0 auto; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0 6px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand b { font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
.brand span { font-size: 13px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-actions { display: flex; align-items: center; gap: 6px; }
.icon-btn { width: 40px; height: 40px; display: inline-grid; place-items: center; border: 0; background: transparent; border-radius: 12px; color: var(--ink-2); }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn svg { width: 22px; height: 22px; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-3); padding: 4px 8px; border-radius: 99px; background: var(--surface-2); border: 0; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.sync.ok i { background: var(--good); } .sync.busy i { background: var(--warn); } .sync.err i { background: var(--bad); }

.view { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; padding: 10px 0 24px; }
.view > * { min-width: 0; }
@media (min-width: 880px) { .view { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 28px; } .span2 { grid-column: 1 / -1; } }

/* ───── sections & rows ───── */
.sec { display: grid; gap: 10px; align-content: start; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sec-head .tools { display: flex; gap: 6px; align-items: center; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 4px 16px; }
.panel.pad { padding: 16px; }
.rows > * + * { border-top: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 0; width: 100%; background: none; border: 0; text-align: left; }
button.row:hover { background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .s { font-size: 13px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .v { text-align: right; white-space: nowrap; }
.row .v b { font-weight: 500; display: block; }

.hero { display: grid; gap: 6px; padding-top: 6px; }
.hero .label { font-size: 14px; color: var(--ink-2); display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.hero .big { font-size: clamp(44px, 13vw, 60px); font-weight: 600; letter-spacing: -.025em; line-height: 1.04; }
.hero .big .dec { font-size: .5em; font-weight: 500; color: var(--ink-2); letter-spacing: 0; }
.delta { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
.delta svg { width: 12px; height: 12px; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-top: 10px; }
.kpis > div { padding: 12px 0 12px 12px; border-left: 1px solid var(--line); min-width: 0; }
.kpis > div:first-child { border-left: 0; padding-left: 0; }
.kpis b { display: block; font-size: 18px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
.kpis span { font-size: 12.5px; color: var(--ink-3); }

.chip { border: 0; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.chip.ok i { background: var(--good); } .chip.warn { background: var(--warn-soft); color: var(--warn); } .chip.warn i { background: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); } .chip.accent { background: var(--accent-soft); color: var(--accent); }
.tag { font-size: 11.5px; padding: 1px 7px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); margin-left: 6px; vertical-align: 1px; }

.btn { min-height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid transparent; background: var(--btn-bg); color: var(--btn-ink); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-2); font-weight: 500; }
.btn.soft { background: var(--surface-2); color: var(--ink); font-weight: 500; }
.btn.danger { background: transparent; color: var(--bad); border-color: var(--line-2); font-weight: 500; }
.btn.armed { background: var(--bad); color: #fff; border-color: transparent; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 500; text-align: left; }

.field { display: grid; gap: 5px; min-width: 0; }
.field > label, .lbl { font-size: 13px; color: var(--ink-2); }
.field .hint { font-size: 12px; color: var(--ink-3); }
.in, select.in, textarea.in { width: 100%; min-height: 44px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); font-size: 16px; }
textarea.in { min-height: 96px; resize: vertical; font-size: 16px; }
.in:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stack { display: grid; gap: 12px; }
.check { display: flex; align-items: center; gap: 10px; min-height: 40px; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; border-radius: 9px; min-height: 36px; padding: 0 8px; font-size: 14px; color: var(--ink-2); white-space: nowrap; }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
.seg.scroll { overflow-x: auto; grid-auto-columns: max-content; }

.bar { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar.warn > i { background: var(--c4); } .bar.bad > i { background: var(--c8); }
.hb { display: grid; grid-template-columns: minmax(70px, 34%) 1fr auto; align-items: center; gap: 10px; padding: 7px 0; font-size: 14px; }
.hb .tr { height: 14px; background: transparent; position: relative; }
.hb .tr i { position: absolute; inset: 0 auto 0 0; background: var(--c1); border-radius: 0 4px 4px 0; min-width: 2px; }
.hb .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb .vl { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

.note { font-size: 13px; color: var(--ink-2); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.note.warn { background: var(--warn-soft); color: var(--warn); }
.note.bad { background: var(--bad-soft); color: var(--bad); }
.note.good { background: var(--good-soft); color: var(--good); }
.empty { text-align: center; padding: 26px 12px; color: var(--ink-2); display: grid; gap: 10px; justify-items: center; }

/* ───── insights ───── */
.ins { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: start; padding: 12px 0; width: 100%; text-align: left; background: none; border: 0; }
.ins svg.ic { width: 20px; height: 20px; margin-top: 1px; }
.ins .t { font-weight: 500; } .ins .s { font-size: 13.5px; color: var(--ink-2); margin-top: 2px; }
.ins.warn svg.ic { color: var(--warn); } .ins.info svg.ic { color: var(--accent); } .ins.good svg.ic { color: var(--good); } .ins.alert svg.ic { color: var(--bad); }
.ins .go { color: var(--ink-3); width: 18px; height: 18px; margin-top: 2px; }

/* ───── graphiques ───── */
.chart { position: relative; width: 100%; touch-action: pan-y; }
.chart.line { height: 210px; } .chart.cols { height: 170px; } .chart.spark { height: 56px; }
.chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
.chart .gl { stroke: var(--grid); stroke-width: 1; } .chart .ax { stroke: var(--axis); stroke-width: 1; }
.chart text { fill: var(--ink-3); font-size: 11px; font-family: var(--font); }
.chart text.lab { fill: var(--ink-2); font-weight: 500; }
.tip { position: absolute; pointer-events: none; z-index: 5; background: var(--surface); border: 1px solid var(--line-2); box-shadow: var(--shadow); border-radius: 10px; padding: 7px 10px; font-size: 12.5px; min-width: 120px; transform: translate(-50%, -100%); white-space: nowrap; }
.tip b { font-weight: 600; } .tip .d { color: var(--ink-3); margin-bottom: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.tbl th { text-align: left; font-weight: 500; color: var(--ink-3); padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); }
.tbl td { padding: 7px 8px 7px 0; border-bottom: 1px solid var(--line); }
.tbl th:last-child, .tbl td:last-child { text-align: right; padding-right: 0; }
.tbl .r { text-align: right; }
.scroll-x { overflow-x: auto; }
.donut-wrap { display: grid; grid-template-columns: 150px 1fr; gap: 16px; align-items: center; }
@media (max-width: 420px) { .donut-wrap { grid-template-columns: 1fr; justify-items: center; } .donut-wrap .legend-list { width: 100%; } }
.donut { width: 150px; height: 150px; }
.donut text { fill: var(--ink); font-family: var(--font); }
.legend-list { display: grid; gap: 2px; }
.legend-list .lr { display: grid; grid-template-columns: 12px 1fr auto; gap: 8px; align-items: center; padding: 5px 0; font-size: 14px; }
.legend-list .lr i { width: 10px; height: 10px; border-radius: 3px; }

/* ───── coupons (calendrier des dividendes) ───── */
.coupons { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.coupons .cp-head { padding: 14px 16px 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.coupons .cp-head b { font-size: 22px; font-weight: 600; letter-spacing: -.015em; }
.coupons .perf { position: relative; border-top: 1px dashed var(--line-2); height: 0; }
.coupons .perf::before, .coupons .perf::after { content: ""; position: absolute; top: -8px; width: 16px; height: 16px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line); }
.coupons .perf::before { left: -9px; } .coupons .perf::after { right: -9px; }
.cp-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; padding: 14px 12px 6px; align-items: end; }
.cp-col { display: grid; justify-items: center; gap: 4px; align-content: end; min-width: 0; background: none; border: 0; padding: 0; }
.cp-col .amt { font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; height: 14px; white-space: nowrap; }
.cp-col .bx { width: 100%; max-width: 22px; height: 70px; display: flex; align-items: flex-end; }
.cp-col .bx i { display: block; width: 100%; background: var(--other); border-radius: 4px 4px 0 0; opacity: .55; min-height: 2px; }
.cp-col.now .bx i { background: var(--accent); opacity: 1; }
.cp-col.has .bx i { opacity: .9; background: var(--c1); }
.cp-col.zero .bx i { height: 2px !important; background: var(--line-2); opacity: 1; border-radius: 0; }
.cp-col .mo { font-size: 11.5px; color: var(--ink-3); }
.cp-col.now .mo { color: var(--accent); font-weight: 600; }
.cp-col[aria-pressed="true"] .mo { color: var(--ink); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.cp-detail { padding: 6px 16px 14px; font-size: 14px; color: var(--ink-2); min-height: 40px; }

/* ───── navigation ───── */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line);
  padding: 6px max(10px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px)); }
.tabs .in-tabs { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
.tab { display: grid; justify-items: center; gap: 2px; padding: 6px 2px 4px; border: 0; background: none; color: var(--ink-3); font-size: 11.5px; border-radius: 10px; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-selected="true"] { color: var(--accent); font-weight: 600; }

/* ───── feuilles (sheets) ───── */
.back { position: fixed; inset: 0; z-index: 40; background: rgba(8, 14, 12, .5); display: flex; align-items: flex-end; justify-content: center; animation: fade .18s ease-out; }
.sheet { width: min(100%, 620px); max-height: min(92vh, 900px); overflow-y: auto; background: var(--bg); border-radius: 20px 20px 0 0; box-shadow: var(--shadow); padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: rise .22s cubic-bezier(.2, .8, .2, 1); overscroll-behavior: contain; }
@media (min-width: 700px) { .back { align-items: center; } .sheet { border-radius: 20px; } }
.sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line-2); margin: 4px auto 8px; }
.sheet .sh-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0 12px; position: sticky; top: 0; background: var(--bg); z-index: 2; }
.sheet .sh-head h2 { font-size: 18px; }
@keyframes rise { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .back, .sheet { animation: none; } * { scroll-behavior: auto !important; } }

.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: min(92vw, 460px); box-shadow: var(--shadow); }

.sparkbox { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
.stat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 18px; }
.stat-grid > div { padding: 9px 0; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.stat-grid > div span:first-child { color: var(--ink-3); } .stat-grid > div span:last-child { font-variant-numeric: tabular-nums; text-align: right; }
.divgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.divgrid .field label { font-size: 12px; }
.divgrid .in { min-height: 40px; padding: 6px 8px; font-size: 15px; }
.pre { white-space: pre-wrap; font-size: 14px; line-height: 1.5; }
.plan-line { display: grid; gap: 4px; padding: 14px 0; }
.plan-line .top1 { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.plan-line .top1 b { font-size: 16px; font-weight: 600; }
.rank-n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--surface-2); font-size: 12px; font-weight: 600; flex: none; }
.rank-n.on { background: var(--accent); color: var(--btn-ink); }
details.fold > summary { cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 0; font-weight: 500; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--ink-3); border-bottom: 2px solid var(--ink-3); transform: rotate(45deg); transition: transform .15s; margin-right: 4px; }
details.fold[open] > summary::after { transform: rotate(-135deg); }
input[type=range] { width: 100%; accent-color: var(--accent); min-height: 32px; }

<script>
/* core.js — Carnet PEA : logique pure, sans dépendance.
   Utilisable sous Node (tests) et dans le navigateur (global PEA).
   Information et simulation uniquement : aucune recommandation personnalisée. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.PEA = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* ───────────────────────── utilitaires ───────────────────────── */
  const sum = (a, f) => { let s = 0; for (const x of a) s += f ? f(x) : x; return s; };
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const r2 = x => Math.round((x + Number.EPSILON) * 100) / 100;

  const r6 = x => Math.round((x + Number.EPSILON) * 1e6) / 1e6;
  const clone = o => JSON.parse(JSON.stringify(o));
  let _seq = 0;
  const uid = () => 'i' + Date.now().toString(36) + (++_seq).toString(36) + Math.random().toString(36).slice(2, 5);

  /** Nombre depuis une saisie française ("1 234,56", "12,5 %", 12.5). */
  function num(v, d) {
    const fallback = d === undefined ? NaN : d;
    if (typeof v === 'number') return isFinite(v) ? v : fallback;
    if (v == null) return fallback;
    let s = String(v).replace(/[\s  €%]/g, '');
    if (s === '' || s === '-' || s === '+' || s === '.' || s === ',') return fallback;

  }

  const MONTHS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
  const MONTHS_LONG = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  const DAYS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];

  /* ───────────────────────── dates ───────────────────────── */
  const pad2 = n => String(n).padStart(2, '0');
  function parseISO(s) {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(typeof s === 'string' ? s : '');

    const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));

  }
  const isoOf = d => d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate());
  const addDays = (iso, n) => { const d = parseISO(iso); d.setUTCDate(d.getUTCDate() + n); return isoOf(d); };
  function addMonths(iso, n) {

  }
  /** Date saisie "jj/mm/aaaa" ou "aaaa-mm-jj" → ISO ou null. */
  function parseDateAny(s) {
    s = String(s == null ? '' : s).trim();
    let m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);
    if (m) { const iso = m[1] + '-' + pad2(+m[2]) + '-' + pad2(+m[3]); return parseISO(iso) ? iso : null; }
    m = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})/.exec(s);
    if (m) { const iso = m[3] + '-' + pad2(+m[2]) + '-' + pad2(+m[1]); return parseISO(iso) ? iso : null; }
    return null;
  }

  /* ───────────────────────── formats ───────────────────────── */
  const fmt = (() => {
    const cache = {};
    const mk = (key, o) => cache[key] || (cache[key] = new Intl.NumberFormat('fr-FR', o));
    const eurO = (d, s) => ({ style: 'currency', currency: 'EUR', minimumFractionDigits: d, maximumFractionDigits: d, signDisplay: s ? 'exceptZero' : 'auto' });
    const pctO = (d, s) => ({ style: 'percent', minimumFractionDigits: d, maximumFractionDigits: d, signDisplay: s ? 'exceptZero' : 'auto' });
    return {
      eur: (x, d = 2) => mk('e' + d, eurO(d, false)).format(x),
      eurS: (x, d = 2) => mk('es' + d, eurO(d, true)).format(x),
      pct: (x, d = 1) => mk('p' + d, pctO(d, false)).format(x),
      pctS: (x, d = 1) => mk('ps' + d, pctO(d, true)).format(x),
      n: (x, d = 0) => mk('n' + d, { minimumFractionDigits: d, maximumFractionDigits: d }).format(x),
      date: iso => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? m[3] + '/' + m[2] + '/' + m[1] : ''; },
      dateShort: iso => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? m[3] + '/' + m[2] : ''; },
      monthYear: iso => { const d = parseISO(iso); return d ? MONTHS[d.getUTCMonth()] + ' ' + d.getUTCFullYear() : ''; },
      dateLong: iso => { const d = parseISO(iso); return d ? DAYS[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MONTHS_LONG[d.getUTCMonth()] + ' ' + d.getUTCFullYear() : ''; },
    };
  })();

  /* ───────────────────────── calendrier de marché (Euronext Paris) ───────────────────────── */
  function easterSunday(y) {
    const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4;
    const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
    const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;

  }
  function holidays(y) {
    const e = easterSunday(y), at = n => { const d = new Date(e.getTime()); d.setUTCDate(d.getUTCDate() + n); return isoOf(d); };
    return {
      [y + '-01-01']: "Jour de l'An", [at(-2)]: 'Vendredi saint', [at(1)]: 'Lundi de Pâques',
      [y + '-05-01']: 'Fête du Travail', [y + '-12-25']: 'Noël', [y + '-12-26']: 'Lendemain de Noël',
    };
  }
  function isOpenDay(iso) {
    const d = parseISO(iso), dow = d.getUTCDay();

  }
  function nextTradingDay(iso) {
    let d = iso;

  }
  function marketInfo(iso) {
    const d = parseISO(iso), dow = d.getUTCDay(), h = holidays(d.getUTCFullYear())[iso];
    let reason = null;

    else if (h) reason = h;
    const open = !reason;
    const md = iso.slice(5);

  }
  /** Heure de Paris → { iso, minutes }. */
  function parisNow(now) {
    const parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Paris', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(now || new Date());
    const g = t => parts.find(p => p.type === t).value;
    return { iso: g('year') + '-' + g('month') + '-' + g('day'), minutes: (+g('hour') % 24) * 60 + +g('minute') };
  }
  /** 'ouvert' | 'avant' | 'apres' | 'ferme' (jour non coté). Séance continue 9h00–17h30. */
  function sessionNow(now) {
    const p = parisNow(now);
    if (!isOpenDay(p.iso)) return { state: 'ferme', iso: p.iso };
    if (p.minutes < 540) return { state: 'avant', iso: p.iso };
    if (p.minutes >= 1050) return { state: 'apres', iso: p.iso };

  }

  /* ───────────────────────── réglages / normalisation ───────────────────────── */
  const MODES = {
    revenus: { label: 'Revenus', desc: 'Le dividende le plus élevé d’abord (plafond de pondération respecté).' },
    mixte: { label: 'Mixte', desc: 'Rendement ajusté de la place restante sous le plafond : favorise les lignes rémunératrices encore légères.' },
    equilibre: { label: 'Équilibre', desc: 'Renforce les lignes les plus sous-pondérées par rapport à leur cible (égalité par défaut).' },
    creux: { label: 'Creux', desc: 'Renforce ce qui recule le plus (sous son plus haut 52 sem. ou sous ton PRU).' },
  };
  const TYPES = { action: 'Action', etf: 'ETF', levier: 'ETF levier' };

  /** Barèmes de courtage (ordres en ligne sur Euronext Paris). PEA : frais plafonnés à 0,5 % de l'ordre. */
  const FEE_MODELS = {
    starter: { label: 'Fortuneo Starter', desc: '0,35 % par ordre ; 1er ordre ≤ 500 € du mois offert' },
    progress: { label: 'Fortuneo Progress', desc: '4,90 € jusqu’à 3 000 €, puis 0,15 %' },
    traderpro: { label: 'Fortuneo Trader Pro', desc: '9,50 € jusqu’à 10 000 €, puis 0,10 %' },
    custom: { label: 'Personnalisé', desc: 'Pourcentage avec minimum par ordre' },
  };
  const defaultSettings = () => ({
    ceiling: 150000, openDate: '', monthlyBudget: 200, feeModel: 'starter', feePct: 0.35, feeMin: 0, feeMaxRatio: 3, peaCap: true,

  function normSettings(s) {
    const d = defaultSettings(), o = Object.assign(d, s && typeof s === 'object' ? s : {});
    const n = (k, lo, hi) => { o[k] = clamp(num(o[k], d[k]), lo, hi); };
    n('ceiling', 1000, 1e7); n('monthlyBudget', 0, 1e6); n('feePct', 0, 10); n('feeMin', 0, 100); n('feeMaxRatio', 0, 100);
    n('cap', 5, 100); n('maxLines', 1, 10); n('staleDays', 0, 60); n('divGoal', 0, 1e6); n('psRate', 0, 50);
    if (!FEE_MODELS[o.feeModel]) o.feeModel = 'custom';
    o.peaCap = o.peaCap !== false;
    o.bench = String(o.bench || 'WPEA.PA').slice(0, 20);
    o.maxLines = Math.round(o.maxLines);
    if (!MODES[o.mode]) o.mode = 'mixte';
    o.includeETF = !!o.includeETF; o.includeLev = !!o.includeLev; o.useCash = !!o.useCash;
    o.openDate = parseISO(o.openDate) ? String(o.openDate).slice(0, 10) : '';

  }

  function normPos(p) {
    p = p || {};
    const div = Array.isArray(p.div) ? p.div.slice(0, 12).map(x => Math.max(0, num(x, 0))) : [];

    const t = num(p.target, NaN);
    const o = {
      id: String(p.id || uid()), name: String(p.name || 'Ligne').slice(0, 80), short: String(p.short || '').slice(0, 30), ticker: String(p.ticker || '').trim().slice(0, 20),
      type: TYPES[p.type] ? p.type : 'action', sector: String(p.sector || '').slice(0, 40), zone: String(p.zone || '').slice(0, 30),
      qty: Math.max(0, num(p.qty, 0)), pru: Math.max(0, num(p.pru, 0)), price: Math.max(0, num(p.price, 0)),
      priceDate: parseISO(p.priceDate) ? String(p.priceDate).slice(0, 10) : '',
      div, buyable: p.buyable !== false, group: p.group ? String(p.group).slice(0, 30) : '',
      target: isFinite(t) ? clamp(t, 0, 1) : null,
      note: String(p.note || '').slice(0, 300), assumed: !!p.assumed,
      closes, histEnd: parseISO(p.histEnd) ? String(p.histEnd).slice(0, 10) : '', stats: null,

  }
  const normDeposit = d => {
    const date = parseISO(d && d.date) ? d.date.slice(0, 10) : null, amount = num(d && d.amount, 0);

  };

  };
  const normTrade = t => {

  function normalizeState(raw) {

      positions: (Array.isArray(raw.positions) ? raw.positions : []).slice(0, 100).map(normPos),
      deposits: (Array.isArray(raw.deposits) ? raw.deposits : []).slice(0, 3000).map(normDeposit).filter(Boolean),
      dividends: (Array.isArray(raw.dividends) ? raw.dividends : []).slice(0, 3000).map(normDividend).filter(Boolean),
      trades: (Array.isArray(raw.trades) ? raw.trades : []).slice(0, 3000).map(normTrade).filter(Boolean),
      history: (Array.isArray(raw.history) ? raw.history : []).slice(-1200).map(normSnap).filter(Boolean),

    const seen = new Set();
    S.positions.forEach(p => { while (seen.has(p.id)) p.id = uid(); seen.add(p.id); });
    S.deposits.sort((a, b) => a.date.localeCompare(b.date));
    S.dividends.sort((a, b) => a.date.localeCompare(b.date));
    S.trades.sort((a, b) => a.date.localeCompare(b.date));

  }
  function validateImport(obj) {

  /* ───────────────────────── frais / quantités ───────────────────────── */
  /** Frais d'un ordre. free = le 1er ordre ≤ 500 € du mois est encore disponible (Starter). */

  /* ───────────────────────── portefeuille ───────────────────────── */

  /** Dividendes attendus par mois de versement : 12 listes de {id,name,perShare,amount}. */

  /* ───────────────────────── performance & règles PEA ───────────────────────── */

  /* ───────────────────────── écritures (immuables) ───────────────────────── */
  function applyTrade(S, t) {

    if (!p) throw new Error('Ligne introuvable.');

    if (!(q > 0) || !(px > 0)) throw new Error('Quantité et prix requis.');

  /* ───────────────────────── conseiller d'achat ───────────────────────── */

    for (let m = 1; m < (1 << arr.length); m++) {
      const s = []; for (let i = 0; i < arr.length; i++) if (m & (1 << i)) s.push(arr[i]);
      if (s.length <= maxSize) out.push(s);
    }
    return out;
  }

  function planPurchase(S, opts) {
    const st = S.settings;
    const o = Object.assign({
      budget: st.monthlyBudget, mode: st.mode, includeETF: st.includeETF, includeLev: st.includeLev, useCash: st.useCash,
      maxLines: st.maxLines, cap: st.cap / 100, feeRatioMax: st.feeMaxRatio / 100, date: todayISO(),
    }, opts || {});
    if (o.free === undefined) o.free = freeOrderAvailable(S, o.date);
    if (!MODES[o.mode]) o.mode = 'mixte';
    const P = calcPortfolio(S), V = P.secValue;
    const avail = r2(Math.max(0, num(o.budget, 0)) + (o.useCash ? Math.max(0, P.cash) : 0));

    const rows = P.groups.map(g => ({ g, excluded: eligibility(g, o) }));
    const elig = rows.filter(r => !r.excluded);
    const ctx = { V, avail, nElig: elig.length };
    elig.forEach(r => { const d = describeScore(r.g, o, ctx); r.score = scoreCore(r.g, o, ctx, 0, 0); r.metric = d.metric; r.why = d.why; });
    elig.sort((a, b) => b.score - a.score || a.g.price - b.g.price);
    const best0 = elig.length ? elig[0].score : 0;

    // « si tu n'achètes que celle-ci »
    elig.forEach(r => {
      const f = waterFill([r], avail, o, st, ctx), q = f.q[0];
      r.single = { qty: q, amount: r2(f.amt[0]), fee: q > 0 ? fee(f.amt[0], st, o.free) : 0, divAdd: q * r.g.divPS };
    });

    // meilleure combinaison (≤ maxLines lignes parmi les 5 mieux classées) : gain de score − frais − report
    const pool = elig.filter(r => r.score > 0).slice(0, 5);
    let bestPlan = null;
    if (pool.length && avail > 0) {
      subsetsOf(pool, o.maxLines).forEach(subset => {
        const f = waterFill(subset, avail, o, st, ctx), used = f.q.filter(k => k > 0).length;
        if (!used) return;
        let fees = 0, valid = true;
        const fl = planFees(f.amt, st, o.free);
        subset.forEach((r, i) => {
          if (f.q[i] < 1) return;
          const fe = fl[i];
          fees += fe;
          if (used >= 2 && f.amt[i] > 0 && fe / f.amt[i] > o.feeRatioMax + 1e-9) valid = false;
        });
        if (!valid) return;
        const left = avail - f.spent - fees, U = f.gain - best0 * fees - (best0 / 12) * left;
        const better = !bestPlan || U > bestPlan.U + 1e-9 || (Math.abs(U - bestPlan.U) <= 1e-9 && (used < bestPlan.used || (used === bestPlan.used && f.spent > bestPlan.f.spent)));
        if (better) bestPlan = { U, used, subset, f, fees, left };
      });
    }

    const lines = [];
    if (bestPlan) {
      const fl = planFees(bestPlan.f.amt, st, o.free);
      bestPlan.subset.forEach((r, i) => {
        const k = bestPlan.f.q[i];
        if (k < 1) return;
        const amount = r2(k * r.g.price);
        lines.push({
          key: r.g.key, posId: r.g.mainId, name: r.g.name, short: r.g.short, qty: k, price: r.g.price, amount, fee: fl[i], free: o.free && fl[i] === 0 && amount > 0, reason: r.why, metric: r.metric,
          weightBefore: r.g.weight, divAdd: k * r.g.divPS, type: r.g.type, score: r.score,
        });
      });
      lines.sort((a, b) => b.score - a.score);
    }
    const spend = r2(sum(lines, l => l.amount)), fees = r2(sum(lines, l => l.fee)), left = r2(avail - spend - fees);

    // état après achats (simulation : espèces manquantes créditées virtuellement)
    let after = clone(S);
    after.cash = Math.max(after.cash, r2(spend + fees + 1));
    lines.forEach(l => { after = applyTrade(after, { side: 'buy', posId: l.posId, qty: l.qty, price: l.price, fee: l.fee, date: o.date }); });
    const A = calcPortfolio(after);
    lines.forEach(l => { const g = A.groups.find(x => x.ids.includes(l.posId)); l.weightAfter = g ? g.weight : 0; });

    const chosen = new Set(lines.map(l => l.key)), skipped = [], ranking0 = elig[0] ? { key: elig[0].g.key, name: elig[0].g.name, single: elig[0].single } : null;
    elig.forEach(r => {
      if (chosen.has(r.g.key)) return;
      const need = r.g.price + fee(r.g.price, st, o.free);
      if (!(r.score > 0)) skipped.push({ name: r.g.name, why: o.mode === 'equilibre' ? 'déjà à sa cible' : 'score nul avec ce mode (plafond ou pas de dividende)' });
      else if (need > avail + 1e-9) skipped.push({ name: r.g.name, why: 'un titre coûte ' + fmt.eur(r.g.price) + ' (+ frais) : trop pour ' + fmt.eur(avail, 0), price: r.g.price });
      else skipped.push({ name: r.g.name, why: 'moins bon usage du budget que le plan retenu (frais et nombre entier de titres)' });
    });

    const notes = [];
    if (!lines.length) notes.push(avail <= 0 ? 'Budget nul : renseigne un montant à investir.' : 'Aucun achat pertinent avec ce budget et ces réglages (voir « Écartées »).');
    if (lines.length && spend > 0 && fees / spend > 0.015) notes.push('Frais ≈ ' + fmt.pct(fees / spend) + ' de l’achat. Regrouper deux mois d’achats en un seul ordre réduit leur poids.');
    if (st.feeModel === 'starter') {
      if (o.free && lines.some(l => l.free)) notes.push('1er ordre du mois ≤ 500 € offert (Starter) : ' + (lines.length > 1 ? 'les autres ordres paient 0,35 %.' : 'aucun frais sur cet achat.'));
      else if (!o.free && lines.length) notes.push('Ton ordre offert du mois est déjà utilisé : 0,35 % de frais sur cet achat.');
    }
    if (left > 0.5 && lines.length) notes.push('Reste ' + fmt.eur(left) + ' non investi : à reporter sur le prochain achat.');
    if (lines.length && ranking0 && !chosen.has(ranking0.key)) {
      notes.unshift(ranking0.name + ' est n°1 du classement, mais ' + (ranking0.single.qty ? 'l’acheter seule n’investirait que ' + fmt.eur(ranking0.single.amount + ranking0.single.fee, 0) + ' sur ' + fmt.eur(avail, 0) : 'elle ne tient pas dans le budget') + ' : le plan retenu utilise mieux le budget (' + fmt.eur(spend + fees, 0) + ' investis).');
    }
    const costly = skipped.find(s => s.price && s.price > avail);
    if (costly && num(o.budget, 0) > 0) notes.push(costly.name + ' est bien classée mais coûte ' + fmt.eur(costly.price) + ' : en cumulant ' + Math.ceil((costly.price * 1.02) / num(o.budget, 1)) + ' mois de versement, tu pourrais en acheter un.');

    const ranking = elig.map((r, i) => ({
      rank: i + 1, key: r.g.key, name: r.g.name, short: r.g.short, type: r.g.type, score: r.score, metric: r.metric, why: r.why, price: r.g.price, weight: r.g.weight, yld: r.g.yld, single: r.single,
      chosen: chosen.has(r.g.key),

    const excluded = rows.filter(r => r.excluded).map(r => ({ name: r.g.name, why: r.excluded }));

    return {
      options: o, avail, lines, spend, fees, leftover: left, ranking, excluded, skipped, notes,
      before: { divAnnual: P.divAnnual, yld: P.yld, top1: P.top1, secValue: P.secValue },
      after: { divAnnual: A.divAnnual, yld: A.yld, top1: A.top1, secValue: A.secValue },
      divAdd: A.divAnnual - P.divAnnual, state: after, groupsAfter: A.groups,
    };
  }

  /** Feuille de route : N mois d'achats successifs (cours constants), le reliquat est reporté. */
  function planRoadmap(S, months, opts) {
    const st = S.settings, o = Object.assign({ budget: st.monthlyBudget, startDate: nextTradingDay(todayISO()), reinvestDiv: true, useCash: st.useCash }, opts || {});
    let cur = clone(S), carry = o.useCash ? Math.max(0, cur.cash) : 0;
    const rows = [], goal = st.divGoal;
    let goalMonth = null;
    for (let i = 0; i < months; i++) {

      const received = o.reinvestDiv && i > 0 ? sum(cur.positions, p => (p.div[mIdx] || 0) * p.qty) : 0;
      const plan = planPurchase(cur, Object.assign({}, opts || {}, { budget: o.budget + carry + received, useCash: false, date }));
      const P2 = calcPortfolio(plan.state);
      carry = plan.leftover;
      cur = plan.state;
      cur.cash = 0;
      rows.push({ i, date, received, avail: plan.avail, buys: plan.lines.map(l => ({ name: l.name, qty: l.qty, amount: l.amount })), spend: plan.spend, fees: plan.fees, carry, divAnnual: P2.divAnnual, yld: P2.yld, value: P2.secValue });
      if (goal > 0 && goalMonth == null && P2.divAnnual >= goal) goalMonth = i;
    }
    return { rows, goalMonth, end: rows.length ? rows[rows.length - 1] : null };
  }

  /* ───────────────────────── pistes & contexte du moment ───────────────────────── */
  function insights(S, P, today) {
    const st = S.settings, out = [];
    const add = (id, level, title, text, extra) => out.push(Object.assign({ id, level, title, text }, extra || {}));
    const held = P.pos.filter(p => p.qty > 0);
    if (!held.length) {
      add('empty', 'info', 'Aucune ligne', 'Ajoute tes lignes (onglet Lignes) pour activer les analyses.', { tab: 'lignes' });
      return out;
    }
    // 1. fraîcheur des cours
    const dated = held.filter(p => p.priceDate).map(p => p.priceDate).sort();
    if (!dated.length) add('stale', 'warn', 'Cours non datés', 'Mets à jour les cours pour des chiffres fiables.', { act: 'prices', actLabel: 'Mettre à jour' });
    else {
      const age = daysBetween(dated[0], today);
      if (age > st.staleDays) add('stale', age > 14 ? 'warn' : 'info', 'Cours à actualiser', 'Le plus ancien date du ' + fmt.date(dated[0]) + ' (' + age + ' j). Les montants ci-dessous en dépendent.', { act: 'prices', actLabel: 'Mettre à jour' });
    }
    // 2. concentration
    const g0 = P.groups[0];
    if (g0 && g0.weight >= 0.25) {
      const hit = g0.value * 0.2;
      add('conc', g0.assumed ? 'info' : (g0.weight >= 0.35 ? 'warn' : 'info'), g0.name + ' pèse ' + fmt.pct(g0.weight, 0) + ' du PEA',
        (g0.assumed ? 'Concentration assumée. ' : '') + 'À titre d’ordre de grandeur : −20 % sur cette ligne = −' + fmt.eur(hit, 0) + ' (−' + fmt.pct(hit / Math.max(1, P.total), 1) + ' du PEA).', { tab: 'lignes' });
    }
    if (P.groups.length >= 3 && P.top3 >= 0.6) add('top3', 'info', 'Trois lignes = ' + fmt.pct(P.top3, 0) + ' du PEA', P.groups.slice(0, 3).map(g => g.name).join(', ') + '. Équivalent à ≈ ' + fmt.n(P.effN, 1) + ' lignes de poids égal.');
    const s0 = P.bySector[0];
    if (s0 && s0.weight >= 0.35 && P.groups.length > 1) add('sector', 'info', 'Secteur « ' + s0.key + ' » : ' + fmt.pct(s0.weight, 0), 'Une même thématique peut bouger ensemble.');
    // 3. levier
    const lev = P.pos.filter(p => p.type === 'levier' && p.qty > 0);
    if (lev.length) {
      const v = sum(lev, p => p.value);
      add('lev', 'warn', 'ETF à effet de levier : ' + fmt.pct(v / Math.max(1, P.secValue), 1) + ' du PEA', 'Ils répliquent ×2 la variation JOURNALIÈRE de l’indice : sur plusieurs mois ou années, le résultat s’écarte de « 2× l’indice ». Détail et calculateur dans Outils › Levier.', { tab: 'outils', sub: 'levier' });
    }
    // 4. espèces
    if (P.total > 0 && P.cash / P.total > 0.05) add('cash', 'info', 'Espèces : ' + fmt.eur(P.cash, 0) + ' (' + fmt.pct(P.cash / P.total, 1) + ')', 'Non investies : elles ne rapportent pas de dividende.', { tab: 'investir' });
    // 5. dividendes
    if (P.divAnnual > 0) {
      const top = P.groups.slice().sort((a, b) => b.divAnnual - a.divAnnual)[0], share = top.divAnnual / P.divAnnual;
      if (share >= 0.4 && P.groups.filter(g => g.divAnnual > 0).length > 1) add('divconc', 'info', top.name + ' = ' + fmt.pct(share, 0) + ' de tes dividendes', 'Une baisse ou un décalage de son dividende pèserait sur tes revenus.', { tab: 'revenus' });
      add('yoc', 'good', 'Rendement sur coût : ' + fmt.pct(P.yoc), 'Tes dividendes estimés (' + fmt.eur(P.divAnnual, 0) + '/an) rapportés à ce que tu as investi ; ' + fmt.pct(P.yld) + ' sur la valeur actuelle.', { tab: 'revenus' });
    }
    const noDiv = held.filter(p => p.type === 'action' && !(p.divPS > 0));
    if (noDiv.length) add('nodiv', 'info', 'Dividende non renseigné', noDiv.map(p => p.name).join(', ') + ' : indique le dividende par titre (fiche de la ligne) pour fiabiliser les prévisions.', { tab: 'lignes' });
    // 6. sous le PRU
    const below = held.filter(p => p.pnlPct < -0.001 && p.type !== 'levier').sort((a, b) => a.pnlPct - b.pnlPct);
    if (below.length) add('below', 'info', below.length + ' ligne' + (below.length > 1 ? 's' : '') + ' sous ton PRU', below.map(p => p.name + ' (' + fmt.pctS(p.pnlPct) + ')').join(', ') + '.', { tab: 'lignes' });
    // 7. plafond & 5 ans
    const ce = ceilingStatus(S);
    if (ce.ratio >= 0.8) add('ceiling', 'warn', fmt.pct(ce.ratio, 0) + ' du plafond de versements atteint', 'Il reste ' + fmt.eur(ce.remaining, 0) + ' sur ' + fmt.eur(ce.ceiling, 0) + '.', { tab: 'outils', sub: 'fisc' });
    if (parseISO(st.openDate)) {
      const f = fiveYear(st.openDate, today);
      if (f.matured) add('five', 'good', 'PEA de plus de 5 ans', 'Les retraits ne clôturent plus le plan (hors conditions particulières).', { tab: 'outils', sub: 'fisc' });
      else add('five', 'info', 'PEA ouvert depuis ' + (f.years ? f.years + ' an' + (f.years > 1 ? 's' : '') + ' ' : '') + f.months + ' mois', 'Cinq ans le ' + fmt.date(f.matureDate) + '. Avant cette date, un retrait entraîne en principe la clôture du plan.', { tab: 'outils', sub: 'fisc' });
    } else add('five', 'info', 'Date d’ouverture du PEA ?', 'Renseigne-la (Outils › Fiscalité) pour suivre l’échéance des 5 ans.', { tab: 'outils', sub: 'fisc' });
    // 8. dividendes du mois
    const inc = incomeByMonth(S), m = parseISO(today).getUTCMonth();
    const thisM = sum(inc[m], x => x.amount);
    if (thisM > 0) add('divmonth', 'good', 'Ce mois-ci : ≈ ' + fmt.eur(thisM, 0) + ' de dividendes', inc[m].map(x => x.name).join(', ') + '.', { tab: 'revenus' });
    const order = { alert: 0, warn: 1, info: 2, good: 3 };
    return out.sort((a, b) => order[a.level] - order[b.level]);
  }

  function momentInfo(S, dateISO, plan) {
    const mk = marketInfo(dateISO), m = parseISO(dateISO).getUTCMonth(), inc = incomeByMonth(S);
    const tips = [];
    tips.push('Ordre à cours limité : tu fixes le prix maximum payé, au lieu d’un ordre « au marché ».');
    tips.push('Évite les ~15 premières minutes (ouverture) et les dernières avant 17h30 : les écarts de cours y sont souvent plus larges.');
    if (plan && plan.lines.some(l => l.type !== 'action')) tips.push('ETF sur actions américaines : les cotations sont en général plus serrées après 15h30 (heure de Paris), quand Wall Street ouvre.');
    tips.push('Dividendes : l’acheteur d’avant la date de détachement touche le coupon, mais le cours recule d’autant ce jour-là. Jouer le calendrier ne crée pas de gain en soi.');

      date: dateISO, market: mk, monthIdx: m, monthLabel: MONTHS_LONG[m],
      incomeNow: inc[m], incomeNext: inc[(m + 1) % 12], nextMonthLabel: MONTHS_LONG[(m + 1) % 12],
      lines: plan ? plan.lines.map(l => {
        const g = plan.groupsAfter.find(x => x.ids.includes(l.posId));
        return { name: l.name, tech: techLabel(g && g.stats) };

    };
  }

  /* ───────────────────────── projections ───────────────────────── */
  function simulateLongTerm(p) {
    const v0 = num(p.v0, 0), monthly = num(p.monthly, 0), years = clamp(Math.round(num(p.years, 10)), 1, 50);

      }
    }

  }

      lev: Object.assign(f(gL, L * sigma), { mean: Math.exp((L * mu - cost) * years) }),

  }

  return {
    // utilitaires
    num, r2, r4, r6, clamp, sum, clone, uid, fmt, MONTHS, MONTHS_LONG, DAYS,
    // dates & marché
    parseISO, isoOf, addDays, addMonths, addYears, daysBetween, todayISO, parseDateAny, easterSunday, holidays, isOpenDay, nextTradingDay, marketInfo, parisNow, sessionNow,
    // état
    MODES, TYPES, defaultSettings, normSettings, normPos, normalizeState, validateImport,
    // calculs
    FEE_MODELS, fee, planFees, freeOrderAvailable, maxQty, calcPortfolio, incomeByMonth, monthlyIncome, receivedStats, xirr, portfolioXirr, ceilingStatus, fiveYear,
    // écritures

    // technique & import

    planPurchase, planRoadmap, insights, momentInfo,
    // projections
    simulateLongTerm, levRoundTrip, levScenarios,
  };
});

  /* ───────── migration depuis la version 1 (lignes + espèces) ───────── */

  /* ───────── cours & dividendes issus des données de marché ───────── */
  function addTradingDays(iso, k) { let d = iso, i = 0; while (i < k) { d = addDays(d, 1); if (isOpenDay(d)) i++; } return d; }

  /* ───────── dérivation : journal → état « vue » compatible avec le cœur ───────── */

  /* ───────── écritures ───────── */
  const touch = B => { B.updatedAt = new Date().toISOString(); return B; };

      const bad = derive(N, null, null).issues.find(x => x.type === 'oversell' && x.op === o.id);

    }
    return touch(N);
  }
  function updateOp(B, id, patch) {
    const N = clone(B), k = N.ops.findIndex(o => o.id === id);
    if (k < 0) throw new Error('Opération introuvable.');
    const o = normOp(Object.assign({}, N.ops[k], patch, { id, n: N.ops[k].n }), N.ops[k].n);
    if (!o) throw new Error('Valeurs invalides.');
    N.ops[k] = o; sortOps(N.ops);

  }
  function removeOp(B, id) { const N = clone(B); N.ops = N.ops.filter(o => o.id !== id); return touch(N); }
  function upsertInstrument(B, ins) {
    const N = clone(B), x = normInstr(ins), k = N.instruments.findIndex(i => i.id === x.id);
    if (k >= 0) N.instruments[k] = x; else N.instruments.push(x);

  }
  function removeInstrument(B, id) {

  }
  function setManualPrices(B, updates, dateISO) {

  }
  /** Rapprochement : aligne le solde espèces calculé sur celui affiché par le courtier. */

  /* ───────── série de valeur reconstruite (historique de cours) ───────── */

    const m = new Map(); if (h && h.d) h.d.forEach((d, k) => m.set(d, h.c[k]));
    return m;
  }
  /** Valeur du PEA jour par jour depuis la première opération, à partir des cours historiques. */

    opts = opts || {};

    const tick = new Map(B.instruments.map(i => [i.id, i.ticker]));
    const maps = {}, dateSet = new Set();
    B.instruments.forEach(i => { const h = H && i.ticker ? H[i.ticker] : null; if (h && h.d) { maps[i.ticker] = priceAt(h); h.d.forEach(d => { if (d >= start && d <= end) dateSet.add(d); }); } });

  /* ───────── synthèses ───────── */
  function yearStats(S) {
    const years = {};
    const y = d => (years[d.slice(0, 4)] = years[d.slice(0, 4)] || { year: d.slice(0, 4), dep: 0, wd: 0, div: 0, fees: 0, realized: 0, buys: 0, sells: 0 });

  }
  /** Prochains dividendes estimés (dates de l'an dernier décalées d'un an, ou mois saisis). */
  function upcomingDividends(S, today, horizonDays) {

      if (!(p.qty > 0)) return;
      if (p.divSrc === 'auto' && p.divEvents.length) {
        p.divEvents.forEach(e => {
          let pay = PEA.addYears(e.pay, 1), ex = PEA.addYears(e.ex, 1);

        });
      } else {
        p.div.forEach((a, m) => {

  /** Simulation d'un retrait : part de plus-value et prélèvements (taux en réglage). */

  g += '<line class="ax" x1="' + pad.l + '" x2="' + (w - pad.r) + '" y1="' + (pad.t + ih) + '" y2="' + (pad.t + ih) + '"/>';
  (cfg.xTicks || []).forEach((t, i, a) => {
    const anchor = i === 0 && a.length > 1 ? 'start' : i === a.length - 1 && a.length > 1 ? 'end' : 'middle';
    g += '<text x="' + X(t.x) + '" y="' + (h - 6) + '" text-anchor="' + anchor + '">' + esc(t.label) + '</text>';
  });
  const endLabels = [];
  cfg.series.forEach(s => {
    const pts = s.ys.map((v, i) => X(xs[i]).toFixed(1) + ',' + Y(v).toFixed(1));
    if (s.area && n > 1) g += '<path d="M' + pts.join('L') + 'L' + X(xs[n - 1]).toFixed(1) + ',' + Y(T.lo).toFixed(1) + 'L' + X(xs[0]).toFixed(1) + ',' + Y(T.lo).toFixed(1) + 'Z" fill="' + s.color + '" opacity=".10"/>';
    g += '<path d="M' + pts.join('L') + '" fill="none" stroke="' + s.color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    const lx = X(xs[n - 1]), ly = Y(s.ys[n - 1]);
    g += '<circle cx="' + lx + '" cy="' + ly + '" r="4" fill="' + s.color + '" stroke="var(--surface)" stroke-width="2"/>';
    endLabels.push({ x: lx, y: ly, t: (cfg.yFmt || eurK)(s.ys[n - 1]) });
  });
  endLabels.sort((a, b) => a.y - b.y).forEach((l, i, a) => {
    const below = i > 0 && l.y - a[i - 1].y < 18;
    g += '<text class="lab" x="' + (l.x - 8) + '" y="' + (below ? l.y + 18 : l.y - 9) + '" text-anchor="end">' + esc(l.t) + '</text>';
  });
  g += '<line class="cross" y1="' + pad.t + '" y2="' + (pad.t + ih) + '" x1="0" x2="0" stroke="var(--axis)" stroke-width="1" style="display:none"/>';
  cfg.series.forEach((s, k) => { g += '<circle class="hd" data-s="' + k + '" r="4" fill="' + s.color + '" stroke="var(--surface)" stroke-width="2" style="display:none"/>'; });

  el._c = { xs, X, Y, cfg, w, h, pad };
}

/** Colonnes (une série). cfg : { items:[{label, value}], yFmt, hi (index mis en avant), label } */
function drawCols(el, w, h, cfg) {
  const pad = { l: 46, r: 10, t: 14, b: 26 }, iw = w - pad.l - pad.r, ih = h - pad.t - pad.b, items = cfg.items, n = items.length;
  const max = Math.max(1, ...items.map(i => i.value)), T = niceTicks(0, max * 1.08, 4);
  const Y = y => pad.t + ih - (y / T.hi) * ih, band = iw / n, bw = Math.min(24, band * 0.62);
  let g = '';
  T.ticks.forEach(t => { const y = Y(t); g += '<line class="gl" x1="' + pad.l + '" x2="' + (w - pad.r) + '" y1="' + y + '" y2="' + y + '"/><text x="' + (pad.l - 8) + '" y="' + (y + 4) + '" text-anchor="end">' + esc((cfg.yFmt || (v => eurTick(v, T.step)))(t)) + '</text>'; });
  g += '<line class="ax" x1="' + pad.l + '" x2="' + (w - pad.r) + '" y1="' + (pad.t + ih) + '" y2="' + (pad.t + ih) + '"/>';
  const every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 44))));
  const maxI = items.reduce((m, it, i, a) => (it.value > a[m].value ? i : m), 0);
  items.forEach((it, i) => {
    const cx = pad.l + band * (i + 0.5), bh = Math.max(0, (it.value / T.hi) * ih), x = cx - bw / 2, y = pad.t + ih - bh, r = Math.min(4, bh / 2);
    const col = cfg.hi === i ? 'var(--accent)' : 'var(--c1)';
    if (bh > 0.5) g += '<path d="M' + x + ',' + (pad.t + ih) + 'V' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y + 'H' + (x + bw - r) + 'Q' + (x + bw) + ',' + y + ' ' + (x + bw) + ',' + (y + r) + 'V' + (pad.t + ih) + 'Z" fill="' + col + '"' + (cfg.hi != null && cfg.hi !== i ? ' opacity=".75"' : '') + '/>';
    if (i % every === 0 || i === n - 1) g += '<text x="' + cx + '" y="' + (h - 6) + '" text-anchor="middle">' + esc(it.label) + '</text>';
    if ((i === n - 1 || i === maxI) && it.value > 0) g += '<text class="lab" x="' + cx + '" y="' + (y - 5) + '" text-anchor="middle">' + esc((cfg.yFmt || eurK)(it.value)) + '</text>';
  });
  el.innerHTML = '<svg viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '" role="img" aria-label="' + esc(cfg.label || 'Graphique') + '">' + g + '</svg>';
}

function sparkline(values, w, h) {
  const v = values.filter(isFinite);
  if (v.length < 2) return '';
  const lo = Math.min(...v), hi = Math.max(...v), span = hi - lo || 1;
  const pts = v.map((y, i) => (2 + (i / (v.length - 1)) * (w - 4)).toFixed(1) + ',' + (h - 3 - ((y - lo) / span) * (h - 6)).toFixed(1));
  const last = pts[pts.length - 1].split(',');
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '" aria-hidden="true"><path d="M' + pts.join('L') + '" fill="none" stroke="var(--c1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="' + last[0] + '" cy="' + last[1] + '" r="3.5" fill="var(--c1)" stroke="var(--surface)" stroke-width="2"/></svg>';
}

/** Anneau de répartition (≤ 6 segments). items : [{label, weight, color}] */
function donut(items, centerTop, centerBottom) {
  const r = 56, cx = 75, cy = 75, sw = 22, C = 2 * Math.PI * r;
  let off = 0, g = '';
  items.forEach(it => {
    const len = Math.max(0, it.weight * C), gap = items.length > 1 ? 2 : 0;
    if (len > 0.5) g += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + it.color + '" stroke-width="' + sw + '" stroke-dasharray="' + Math.max(0.5, len - gap).toFixed(2) + ' ' + (C - Math.max(0.5, len - gap)).toFixed(2) + '" stroke-dashoffset="' + (-off - gap / 2).toFixed(2) + '" transform="rotate(-90 ' + cx + ' ' + cy + ')"/>';
    off += len;
  });
  return '<svg class="donut" viewBox="0 0 150 150" role="img" aria-label="Répartition du PEA">' + g + '<text x="75" y="76" text-anchor="middle" font-size="22" font-weight="600">' + esc(centerTop) + '</text><text x="75" y="94" text-anchor="middle" font-size="11" style="fill:var(--ink-3)">' + esc(centerBottom) + '</text></svg>';
}

/* ───────── survol / toucher ───────── */
function chartPointer(e) {
  const el = e.target.closest && e.target.closest('.chart[data-chart]');
  $$('.chart[data-chart]').forEach(c => { if (c !== el) hideTip(c); });
  if (!el || !el._c || !el._c.cfg.series) return;
  const c = el._c, rect = el.getBoundingClientRect(), px = e.clientX - rect.left;
  let best = 0, bd = Infinity;
  c.xs.forEach((x, i) => { const d = Math.abs(c.X(x) - px); if (d < bd) { bd = d; best = i; } });
  const x = c.X(c.xs[best]), cross = $('.cross', el), tip = $('.tip', el);
  cross.setAttribute('x1', x); cross.setAttribute('x2', x); cross.style.display = '';
  c.cfg.series.forEach((s, k) => { const d = $('.hd[data-s="' + k + '"]', el); d.setAttribute('cx', x); d.setAttribute('cy', c.Y(s.ys[best])); d.style.display = ''; });
  tip.innerHTML = '<div class="d">' + esc(c.cfg.tipTitle(best)) + '</div>' + c.cfg.series.map(s => '<div><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:' + s.color + ';margin-right:6px"></i>' + esc(s.name) + ' <b>' + esc((c.cfg.tipFmt || fmt.eur)(s.ys[best])) + '</b></div>').join('');
  tip.hidden = false;
  tip.style.left = Math.min(Math.max(x, 70), c.w - 70) + 'px'; tip.style.top = Math.max(c.Y(c.cfg.series[0].ys[best]) - 10, 40) + 'px';
}
function hideTip(el) {
  if (!el || !el._c) return;
  const cross = $('.cross', el), tip = $('.tip', el);
  if (cross) cross.style.display = 'none'; if (tip) tip.hidden = true;

}

/* ───────── fraîcheur des cours ───────── */
function staleInfo(P, t) {
  const held = P.pos.filter(p => p.qty > 0), dates = held.filter(p => p.priceDate).map(p => p.priceDate).sort();
  const manual = held.filter(p => p.priceSrc !== 'auto');
  if (!dates.length) return { oldest: '', age: 999, stale: true, manual };
  const lastOpen = (() => { let d = t; for (let i = 0; i < 10 && !PEA.isOpenDay(d); i++) d = PEA.addDays(d, -1); return d; })();
  const age = PEA.daysBetween(dates[0], lastOpen);
  return { oldest: dates[0], newest: dates[dates.length - 1], age, stale: age > S.settings.staleDays, manual };
}
function priceChip(P, t) {
  const st = staleInfo(P, t);
  if (IS_APP && Q && Q.asOf) {
    const late = st.manual.filter(p => !p.priceDate || PEA.daysBetween(p.priceDate, t) > S.settings.staleDays);
    if (Quotes.busy) return '<span class="chip"><i></i>Mise à jour…</span>';
    if (late.length) return '<button class="chip warn" data-act="prices"><i></i>' + late.length + ' cours à saisir</button>';
    return '<button class="chip ' + (st.stale ? 'warn' : 'ok') + '" data-act="quotes"><i></i>Cours du ' + esc(quoteStamp()) + '</button>';
  }
  if (IS_APP && !Q) return '<button class="chip warn" data-act="quotes"><i></i>' + (Quotes.busy ? 'Chargement des cours…' : 'Cours automatiques indisponibles') + '</button>';
  if (!st.oldest) return '<button class="chip warn" data-act="prices"><i></i>Cours à saisir</button>';
  return st.stale ? '<button class="chip warn" data-act="prices"><i></i>Cours du ' + fmt.date(st.oldest) + ' · mettre à jour</button>' : '<span class="chip ok"><i></i>Cours du ' + fmt.date(st.oldest) + '</span>';
}
/** Variation du jour (lignes cotées automatiquement, dernière séance). */
function dayChange(P) {
  if (!Q || !Q.items) return null;
  let d = 0, base = 0, n = 0, last = '';
  P.pos.forEach(p => { if (p.qty > 0 && p.quote && p.priceSrc === 'auto' && p.quote.d > last) last = p.quote.d; });
  P.pos.forEach(p => { const q = p.quote; if (p.qty > 0 && q && p.priceSrc === 'auto' && q.d === last && q.pc > 0) { d += p.qty * (q.p - q.pc); base += p.qty * q.pc; n++; } });
  return n ? { eur: d, pct: base > 0 ? d / base : 0, date: last } : null;
}

const OP_ICON = { open: 'list', buy: 'plus', sell: 'sell', div: 'coins', dep: 'wallet', wd: 'wallet', fee: 'info', adj: 'refresh' };
function opLabel(o) {
  const k = L.KINDS[o.kind], n = o.instr ? nameOf(o.instr) : '';

  if (o.kind === 'div') return 'Dividende' + (n ? ' · ' + n : '');

}
function cashBreakdown() {
  const c = { dep: 0, wd: 0, div: 0, sell: 0, buy: 0, fee: 0, adj: 0 };
  B.ops.forEach(o => {
    if (o.kind === 'dep' && !o.noCash) c.dep += o.amount; else if (o.kind === 'wd') c.wd += o.amount; else if (o.kind === 'div' && !o.noCash) c.div += o.amount;
    else if (o.kind === 'sell') c.sell += o.qty * o.price - o.fee; else if (o.kind === 'buy') c.buy += o.qty * o.price + o.fee; else if (o.kind === 'fee') c.fee += o.amount; else if (o.kind === 'adj') c.adj += o.amount;
  });
  return c;
}
