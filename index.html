  const incNext = mo.incomeNext.length ? mo.incomeNext.map(x => esc(nameOf(x.id) || x.name) + ' ≈ ' + fmt.eur(x.amount, 2)).join(' · ') : 'aucun';
  const tech = mo.lines.filter(l => l.tech.length).map(l => '<div class="small"><b>' + esc(l.name) + '</b> — ' + l.tech.map(x => esc(x.text + (x.note ? ' (' + x.note + ')' : ''))).join(' · ') + '</div>').join('');
  const freeTip = S.settings.feeModel === 'starter' ? '<div class="small soft">' + (PEA.freeOrderAvailable(S, o.date) ? 'Ton ordre offert (≤ 500 €) de ' + PEA.MONTHS_LONG[PEA.parseISO(o.date).getUTCMonth()] + ' est disponible : le premier ordre du mois ne coûte rien.' : 'Ordre offert de ' + PEA.MONTHS_LONG[PEA.parseISO(o.date).getUTCMonth()] + ' déjà utilisé : 0,35 % de frais.') + '</div>' : '';
  const moment = '<div class="panel pad stack"><div class="rb"><b>' + esc(fmt.dateLong(o.date)) + '</b>' + status + '</div>' +
    (mk.open ? '<div class="small soft">Séance continue de 9h00 à 17h30 (Paris).' + (mk.half ? ' Horaires réduits possibles ce jour-là.' : '') + '</div>' : '<div class="small soft">L’ordre sera exécuté à l’ouverture du <b>' + esc(fmt.dateLong(mk.next)) + '</b>. <button class="link" data-act="setdate" data-v="' + mk.next + '">Choisir cette date</button></div>') + freeTip +
    '<div class="small"><span class="muted">Dividendes en ' + esc(mo.monthLabel) + ' :</span> ' + incNow + '<br><span class="muted">En ' + esc(mo.nextMonthLabel) + ' :</span> ' + incNext + '</div>' +
    (tech || '<div class="small muted">' + (IS_APP ? 'Les indicateurs techniques (RSI, moyennes mobiles, plus haut 52 sem.) apparaissent dès que les cours automatiques sont chargés.' : 'Indicateurs techniques : importe l’historique de cours d’une ligne depuis sa fiche.') + '</div>') +
    '<details class="fold"><summary>Conseils d’exécution</summary><ul class="small soft" style="margin:0 0 8px;padding-left:18px;display:grid;gap:6px">' + mo.tips.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></details></div>';
  const rm = PEA.planRoadmap(S, UI.road, { budget: num(o.budget, 0), startDate: o.date, useCash: o.useCash, mode: o.mode, includeETF: o.includeETF, includeLev: o.includeLev });
  const rmTable = '<table class="tbl"><thead><tr><th>Mois</th><th>Achats</th><th class="r">Div./an</th></tr></thead><tbody>' + rm.rows.map(r => '<tr><td>' + esc(fmt.monthYear(r.date)) + '</td><td>' + (r.buys.length ? r.buys.map(b => b.qty + '× ' + esc(shortName(b.name))).join(', ') : '<span class="muted">report</span>') + '</td><td class="r">' + fmt.eur(r.divAnnual, 0) + '</td></tr>').join('') + '</tbody></table>';
  const last = rm.end;
  const road = '<div class="panel pad stack">' + segHtml('road', [[6, '6 mois'], [12, '12 mois'], [24, '24 mois']], UI.road) +
    '<div class="small soft">En répétant ce plan chaque mois (cours constants, dividendes réinvestis) : <b>≈ ' + fmt.eur(last.divAnnual, 0) + ' / an</b> de dividendes dans ' + UI.road + ' mois (<span class="up">+' + fmt.eur(last.divAnnual - P.divAnnual, 0) + '</span>) pour ' + fmt.eur(PEA.sum(rm.rows, r => r.spend), 0) + ' investis.' + (S.settings.divGoal > 0 ? (rm.goalMonth === 0 ? ' Ton objectif de ' + fmt.eur(S.settings.divGoal, 0) + ' / an est déjà atteint.' : rm.goalMonth != null ? ' Objectif de ' + fmt.eur(S.settings.divGoal, 0) + ' atteint au mois ' + (rm.goalMonth + 1) + '.' : '') : '') + '</div>' +
    twin('road', '<div class="chart line" data-chart="road" role="img" aria-label="Dividendes annuels projetés mois par mois"></div>', rmTable) + '<div class="rb"><span class="tiny muted">Simulation à cours constants.</span>' + tblBtn('road') + '</div></div>';
  return sec('Prochain achat', controls + notes, '', 'span2') +
    sec('Plan proposé', planBody, '', '') +
    '<div class="stack" style="align-content:start;gap:22px">' + sec('Le moment', moment, '', '') + '</div>' +
    sec('Classement des lignes', '<div class="small muted">À droite : ce que donnerait l’achat de cette seule ligne avec ton budget. Les lignes en bleu composent le plan.</div><div class="panel rows" style="padding-block:0">' + rank + '</div>' + excluded, '', '') +
    sec('Feuille de route', road, '', '') +
    '<p class="disc span2">Simulation selon tes réglages (stratégie, plafond par ligne, barème ' + esc(PEA.FEE_MODELS[S.settings.feeModel].label) + ') : ce n’est pas un conseil en investissement.</p>';
}
const shortName = n => { const p = S.positions.find(x => x.name === n); return p ? p.short || p.name : n; };

/* ───────────────────────── REVENUS ───────────────────────── */
function viewRevenus() {
  if (!S.positions.length) return emptyView();
  const P = PEA.calcPortfolio(S), t = today(), rc = PEA.receivedStats(S, t), goal = S.settings.divGoal;
  const yr = t.slice(0, 4), got = rc.byYear[yr] || 0;
  const goalBlock = goal > 0 ? '<div><div class="rb"><span>Objectif ' + fmt.eur(goal, 0) + ' / an</span><b class="num ' + (P.divAnnual >= goal ? 'up' : '') + '">' + fmt.pct(P.divAnnual / goal, 0) + '</b></div><div class="bar" style="margin:8px 0 4px"><i style="width:' + Math.min(100, P.divAnnual / goal * 100).toFixed(1) + '%"></i></div><div class="tiny muted">' + (P.divAnnual >= goal ? 'Atteint : tu peux relever l’objectif.' : 'Il manque ≈ ' + fmt.eur(goal - P.divAnnual, 0) + ' / an.') + ' <button class="link tiny" data-act="settings">Modifier</button></div></div>' : '<button class="link" data-act="settings">Définir un objectif de dividendes</button>';
  const hero = '<section class="hero"><div class="label"><span>Dividendes estimés par an</span></div><div class="big">' + bigMoney(P.divAnnual, 0) + '</div><div class="small soft">≈ ' + fmt.eur(P.divAnnual / 12, 0) + ' / mois · rendement ' + fmt.pct(P.yld, 2) + ' · ' + fmt.pct(P.yoc, 2) + ' sur coût</div><div class="panel pad" style="margin-top:10px">' + goalBlock + '</div></section>';
  const up = L.upcomingDividends(S, t, 120).slice(0, 8);
  const upHtml = up.length ? '<div class="panel rows">' + up.map(u => '<div class="row"><div class="grow"><div class="t">' + esc(u.name) + '</div><div class="s">' + (u.approx ? 'courant ' + PEA.MONTHS_LONG[PEA.parseISO(u.pay).getUTCMonth()] : 'vers le ' + fmt.dateShort(u.pay) + (u.ex ? ' · détachement ≈ ' + fmt.dateShort(u.ex) : '')) + ' · ' + fmt.eur(u.perShare, 2) + ' / titre</div></div><div class="v"><b class="num up">≈ ' + fmt.eur(u.amount) + '</b></div></div>').join('') + '</div><div class="tiny muted">Estimation d’après les dates de l’an dernier : les montants et dates réels sont annoncés par chaque société.</div>' : '<div class="panel pad empty"><div class="soft">Aucun versement prévu dans les 4 prochains mois.</div></div>';
  const byLine = P.groups.filter(g => g.divAnnual > 0).sort((a, b) => b.divAnnual - a.divAnnual), mx = Math.max(...byLine.map(g => g.divAnnual), 1);
  const lineBars = '<div class="panel pad">' + byLine.map(g => '<div class="hb"><span class="nm">' + esc(g.short || g.name) + '</span><span class="tr"><i style="width:' + (g.divAnnual / mx * 100).toFixed(1) + '%"></i></span><span class="vl">' + fmt.eur(g.divAnnual, 0) + ' <span class="muted tiny">' + fmt.pct(g.yld) + '</span></span></div>').join('') + '<div class="tiny muted" style="margin-top:6px">Montant annuel estimé · rendement sur le cours actuel.</div></div>';
  const recent = S.dividends.slice(-8).reverse().map(d => '<button type="button" class="row" data-act="editop" data-id="' + esc(d.id) + '"><div class="grow"><div class="t">' + esc(nameOf(d.posId) || d.note || 'Dividende') + '</div><div class="s">' + fmt.date(d.date) + (d.noCash ? ' · hors espèces' : '') + '</div></div><div class="v"><b class="num up">+' + fmt.eur(d.amount) + '</b></div></button>').join('');
  const years = Object.keys(rc.byYear).sort().reverse();
  const journal = '<div class="panel pad stack"><div class="rb"><div><div class="muted small">Encaissés en ' + yr + '</div><b style="font-size:20px" class="num">' + fmt.eur(got) + '</b></div><button class="btn soft sm" data-act="newop" data-k="div">' + ic('plus') + 'Dividende reçu</button></div>' + (S.dividends.length ? '<div class="rows">' + recent + '</div><div class="tiny muted">' + years.map(y => y + ' : ' + fmt.eur(rc.byYear[y], 0)).join(' · ') + '</div>' : '<div class="small muted">Note ici les dividendes réellement versés par Fortuneo : ils s’ajoutent à la poche espèces.</div>') + '</div>';
  return hero + sec('Prochains versements', upHtml, '', '') + sec('Calendrier des coupons', couponsBlock(P), '', 'span2') + sec('Par ligne', lineBars, '', '') + sec('Dividendes reçus', journal, '', '') +
    '<p class="disc span2">' + (S.positions.some(p => p.divSrc === 'auto') ? 'Mois et montants calculés d’après les dividendes réellement détachés ces 12 derniers mois (données de marché) ; ' : '') + 'tu peux les corriger dans la fiche de chaque ligne. Dans un PEA, les dividendes de sociétés françaises ne sont pas taxés à l’encaissement.</p>';
}

/* ───────────────────────── OUTILS ───────────────────────── */
function viewOutils() {
  const subs = [['sim', 'Simulateur'], ['fisc', 'Fiscalité'], ['marche', 'Marché'], ['levier', 'Levier ×2'], ['donnees', 'Réglages']];
  if (!subs.some(s => s[0] === UI.sub)) UI.sub = 'sim';
  const body = { sim: simBlock, levier: levBlock, fisc: fiscBlock, marche: marketBlock, donnees: dataBlock }[UI.sub];
  return '<section class="sec span2"><div class="sec-head"><h2>Outils</h2></div><div class="seg scroll" role="tablist">' + subs.map(s => '<button type="button" role="tab" data-act="subtab" data-v="' + s[0] + '" aria-selected="' + (UI.sub === s[0]) + '">' + s[1] + '</button>').join('') + '</div></section>' + body();
}

/* — simulateur — */
function simDefaults() {
  const P = PEA.calcPortfolio(S);
  return { v0: Math.round(P.total), monthly: S.settings.monthlyBudget, years: 15, g: 4, dg: 4, y0: Math.round(P.yld * 10000) / 100, reinvest: true, infl: 0 };
}
function simInputs() { if (!UI.sim) UI.sim = simDefaults(); return UI.sim; }
function runSim() {
  const s = simInputs();
  return PEA.simulateLongTerm({ v0: num(s.v0, 0), monthly: num(s.monthly, 0), years: num(s.years, 10), g: num(s.g, 0) / 100, dg: num(s.dg, 0) / 100, y0: num(s.y0, 0) / 100, reinvest: s.reinvest, infl: num(s.infl, 0) / 100 });
}
function simBlock() {
  const s = simInputs();
  const form = '<div class="panel pad stack">' +
    '<div class="grid2">' + field('Capital de départ (€)', inp('v0', dec(s.v0), { bind: 'sim.v0' })) + field('Versement mensuel (€)', inp('monthly', dec(s.monthly), { bind: 'sim.monthly' })) + '</div>' +
    '<div class="field"><label>Durée : <b id="sim-years">' + s.years + ' ans</b></label><input type="range" min="3" max="40" step="1" value="' + s.years + '" name="years" data-bind="sim.years" aria-label="Durée en années"></div>' +
    '<div class="grid2">' + field('Cours (% / an)', inp('g', dec(s.g), { bind: 'sim.g' })) + field('Dividendes (% / an)', inp('dg', dec(s.dg), { bind: 'sim.dg' })) + '</div>' +
    '<div class="grid2">' + field('Rendement actuel (%)', inp('y0', dec(s.y0), { bind: 'sim.y0' })) + field('Inflation (% / an)', inp('infl', dec(s.infl), { bind: 'sim.infl' })) + '</div>' +
    '<div class="hint tiny muted" style="margin-top:-4px">Inflation : mets 2 pour lire les résultats en euros d’aujourd’hui. Cours et dividendes : hausse annuelle moyenne supposée.</div>' + checkbox('reinvest', 'Réinvestir les dividendes', s.reinvest, 'sim.reinvest') +
    '<div class="btns"><span class="small muted" style="align-self:center">Scénarios :</span><button type="button" class="chip" data-act="simpreset" data-g="2" data-dg="2">Prudent 2 %</button><button type="button" class="chip" data-act="simpreset" data-g="4" data-dg="4">Central 4 %</button><button type="button" class="chip" data-act="simpreset" data-g="6" data-dg="6">Optimiste 6 %</button></div></div>';
  return '<section class="sec"><div class="sec-head"><h2>Simulateur long terme</h2></div>' + form + '<p class="disc">Hypothèses simples (rendements constants) : une illustration, pas une prévision. Les cours réels fluctuent.</p></section><section class="sec" id="sim-out">' + simOut() + '</section>';
}
function simOut() {
  const r = runSim(), e = r.end, s = simInputs(), real = num(s.infl, 0) > 0, rows = r.rows;
  const table = '<table class="tbl"><thead><tr><th>Année</th><th class="r">Valeur</th><th class="r">Versé</th><th>Div./an</th></tr></thead><tbody>' + rows.filter((x, i) => i > 0 && (i % Math.ceil(rows.length / 12) === 0 || i === rows.length - 1)).map(x => '<tr><td>' + x.year + '</td><td class="r">' + fmt.eur(real ? x.real : x.value, 0) + '</td><td class="r">' + fmt.eur(x.invested, 0) + '</td><td>' + fmt.eur(real ? x.annualDiv / Math.pow(1 + num(s.infl, 0) / 100, x.year) : x.annualDiv, 0) + '</td></tr>').join('') + '</tbody></table>';
  const f = v => fmt.eur(real ? v / Math.pow(1 + num(s.infl, 0) / 100, e.year) : v, 0);
  return '<div class="sec-head"><h2>Résultat à ' + e.year + ' ans</h2><div class="tools">' + tblBtn('sim') + '</div></div>' +
    '<div class="panel pad stack"><div class="kpis" style="margin:0"><div><b class="num">' + fmt.eur(real ? e.real : e.value, 0) + '</b><span>valeur du PEA' + (real ? ' (€ constants)' : '') + '</span></div><div><b class="num">' + fmt.eur(e.invested, 0) + '</b><span>capital versé</span></div><div><b class="num">≈ ' + f(e.annualDiv) + '</b><span>dividendes / an</span></div></div>' +
    '<div class="small soft">Soit ≈ ' + f(e.annualDiv / 12) + ' par mois, et ' + fmt.pct(e.yoc, 1) + ' de rendement sur le capital versé. Dividendes cumulés : ' + fmt.eur(e.cumDiv, 0) + (s.reinvest ? ' (réinvestis)' : ' (encaissés, non réinvestis)') + '.</div>' +
    twin('sim', '<div class="legend"><span><i style="background:var(--c1)"></i>Valeur</span><span><i style="background:var(--c2)"></i>Capital versé</span></div><div class="chart line" data-chart="sim" role="img" aria-label="Projection de la valeur et du capital versé"></div>', table) + '</div>' +
    '<div class="panel pad stack"><h3>Dividendes annuels</h3><div class="chart cols" data-chart="simdiv" role="img" aria-label="Dividendes annuels projetés"></div></div>';
}

/* — fiscalité & règles du PEA — */
function fiscBlock() {
  const t = today(), ce = PEA.ceilingStatus(S), xi = PEA.portfolioXirr(S, t), fy = PEA.fiveYear(S.settings.openDate, t), P = PEA.calcPortfolio(S);
  const ws = L.withdrawalSim(S, P, num(UI.wd, 0), t);
  let sim;
  if (ws.unknown) sim = '<div class="note">Pour simuler un retrait, il faut connaître le total de tes versements depuis l’ouverture : ajoute-les (même en un seul montant cumulé, coché « déjà investi »).</div><div class="btns"><button class="btn soft sm" data-act="newop" data-k="dep">' + ic('plus') + 'Versement passé</button><button class="btn ghost sm" data-act="impdep">Coller plusieurs versements</button></div>';
  else sim = '<div class="stat-grid"><div><span>Versements nets</span><span>' + fmt.eur(ws.net, 0) + '</span></div><div><span>Gain total</span><span class="' + (ws.gains >= 0 ? 'up' : 'dn') + '">' + fmt.eurS(ws.gains, 0) + ' (' + fmt.pct(ws.ratio, 1) + ' du PEA)</span></div><div><span>Part de gain retirée</span><span>' + fmt.eur(ws.taxable) + '</span></div><div><span>Prélèvements sociaux (' + fmt.n(ws.psRate, 1) + ' %)</span><span>−' + fmt.eur(ws.ps) + '</span></div>' + (ws.before5 ? '<div><span>Impôt sur le revenu (12,8 %)</span><span>−' + fmt.eur(ws.ir) + '</span></div>' : '') + '<div><span><b>Net perçu</b></span><span><b>' + fmt.eur(ws.netAmount) + '</b></span></div></div>' +
    '<div class="small soft">' + (ws.before5 === null ? 'Renseigne la date d’ouverture pour savoir si l’impôt sur le revenu s’applique.' : ws.before5 ? 'Avant 5 ans, un retrait entraîne en principe la clôture du PEA, et le gain est imposé (12,8 % + prélèvements sociaux), sauf cas particuliers.' : 'Après 5 ans : pas d’impôt sur le revenu, seulement les prélèvements sociaux, et le PEA reste ouvert.') + '</div>';
  return '<section class="sec"><div class="sec-head"><h2>Mon PEA</h2></div><div class="panel pad stack">' +
    '<div class="grid2">' + field('Date d’ouverture', inp('openDate', S.settings.openDate, { type: 'date', bind: 'set.openDate' })) + field('Plafond de versements (€)', inp('ceiling', dec(S.settings.ceiling), { bind: 'set.ceiling' })) + '</div>' +
    '<div class="stat-grid"><div><span>Versé (cumul)</span><span>' + fmt.eur(ce.paid, 0) + (ce.estimated ? ' *' : '') + '</span></div><div><span>Reste sous le plafond</span><span>' + fmt.eur(ce.remaining, 0) + '</span></div><div><span>Rendement annualisé</span><span>' + (xi.value != null ? fmt.pctS(xi.value) : '—') + '</span></div><div><span>5 ans</span><span>' + (fy ? (fy.matured ? 'atteints' : 'le ' + fmt.date(fy.matureDate)) : '—') + '</span></div></div>' +
    (ce.estimated ? '<div class="note">* Estimation (coût d’achat + espèces). Enregistre tes versements passés pour des chiffres exacts.</div>' : (xi.value == null ? '<div class="note">' + esc(xi.reason) + '</div>' : '')) + '</div></section>' +
    '<section class="sec"><div class="sec-head"><h2>Simuler un retrait</h2></div><div class="panel pad stack">' + field('Montant retiré (€)', inp('wd', dec(UI.wd), { bind: 'ui.wd' })) + '<div id="wd-out">' + sim + '</div></div>' +
    '<p class="disc">Calcul simplifié : la part de gain est proportionnelle à la plus-value globale du plan. Prélèvements sociaux à ' + fmt.n(S.settings.psRate, 1) + ' % (taux applicable depuis le 1er janvier 2026, modifiable dans Réglages) ; les gains acquis avant 2018 peuvent relever de taux historiques. Vérifie auprès de Fortuneo ou d’un conseiller avant de retirer.</p></section>';
}

/* — marché (univers suivi par le robot) — */
function marketRows() {
  if (!Q || !Q.items) return [];
  const names = new Map(U.map(u => [u[0], u]));
  return Object.keys(Q.items).filter(t => t[0] !== '^').map(t => {
    const q = Q.items[t], u = names.get(t) || [t, t, 'action', ''];
    const div12 = (q.dv || []).filter(e => e[0] > PEA.addDays(String(Q.asOf).slice(0, 10), -365)).reduce((s, e) => s + e[1], 0);
    return { t, n: u[1], k: u[2], s: u[3], q, yld: q.p > 0 ? div12 / q.p : 0, dd: q.h52 > 0 ? q.p / q.h52 - 1 : 0, held: S.positions.some(p => p.ticker === t && p.qty > 0) };
  });
}
function marketBlock() {
  if (!IS_APP) return '<section class="sec span2"><div class="panel pad empty"><div class="soft">Le tableau du marché est disponible dans l’app installée (cours automatiques).</div></div></section>';
  if (!Q) return '<section class="sec span2"><div class="panel pad empty"><div class="soft">Cours pas encore chargés.</div><button class="btn ghost sm" data-act="quotes">Charger les cours</button></div></section>';
  const sorts = { jour: (a, b) => b.q.ch - a.q.ch, ytd: (a, b) => (b.q.ytd || 0) - (a.q.ytd || 0), rend: (a, b) => b.yld - a.yld, repli: (a, b) => a.dd - b.dd, nom: (a, b) => a.n.localeCompare(b.n, 'fr') };
  const key = sorts[UI.mk] ? UI.mk : 'rend', qq = (UI.mq || '').trim().toLowerCase();
  const rows = marketRows().filter(r => !qq || r.n.toLowerCase().includes(qq) || r.t.toLowerCase().includes(qq) || r.s.toLowerCase().includes(qq)).sort(sorts[key]);
  const metric = r => key === 'jour' ? fmt.pctS(r.q.ch, 2) : key === 'ytd' ? (r.q.ytd != null ? fmt.pctS(r.q.ytd, 1) : '—') : key === 'repli' ? fmt.pctS(r.dd, 1) : key === 'nom' ? fmt.pctS(r.q.ch, 2) : (r.yld > 0 ? fmt.pct(r.yld, 2) : '—');
  const cls = r => key === 'rend' ? '' : ((key === 'repli' ? r.dd : key === 'ytd' ? r.q.ytd : r.q.ch) >= 0 ? 'up' : 'dn');
  const list = rows.map(r => '<button type="button" class="row" data-act="mkt" data-t="' + esc(r.t) + '"><div class="grow"><div class="t">' + esc(r.n) + (r.held ? '<span class="tag">détenue</span>' : '') + '</div><div class="s">' + esc(r.s || r.k) + ' · ' + fmt.eur(r.q.p) + (r.q.stale ? ' · ancien' : '') + '</div></div><div class="v"><b class="num ' + cls(r) + '">' + metric(r) + '</b></div></button>').join('');
  return '<section class="sec span2"><div class="panel pad stack">' + inp('mq', UI.mq || '', { type: 'search', bind: 'ui.mq', ph: 'Rechercher (nom, secteur, ticker)' }) + segHtml('mk', [['rend', 'Rdt'], ['jour', 'Jour'], ['ytd', 'Janv.'], ['repli', 'Repli'], ['nom', 'Nom']], key, 'Trier') + '</div>' +
    '<div class="panel rows" id="mkt-list">' + (list || '<div class="row"><div class="grow soft">Aucun résultat.</div></div>') + '</div><p class="disc">Rendement : dividendes détachés sur 12 mois rapportés au cours. Repli : écart avec le plus haut sur 52 semaines. Données informatives (Yahoo Finance) : un rendement élevé peut aussi signaler un risque sur le dividende.</p></section>';
}

/* — levier — */
function levInputs() { if (!UI.lev) UI.lev = { r1: -20, r2: 25, mu: 7, sigma: 18, cost: 3.5, years: 10 }; return UI.lev; }
function levBlock() {
  const l = levInputs();

    '<p class="small soft">C’est pourquoi ces produits sont conçus pour des horizons courts. Pour un objectif de dividendes sur 10 ans et plus, ils n’en versent d’ailleurs pas (capitalisation).</p></div>';
  const form1 = '<div class="panel pad stack"><h3>Aller-retour sur 2 jours (départ = 100)</h3><div class="grid2">' + field('Jour 1 : indice (%)', inp('r1', dec(l.r1), { bind: 'lev.r1' })) + field('Jour 2 : indice (%)', inp('r2', dec(l.r2), { bind: 'lev.r2' })) + '</div><div id="lev-rt"></div></div>';

  return '<section class="sec">' + intro + mine + '</section><section class="sec">' + form1 + form2 + '<p class="disc">Modèle simplifié (rendements log-normaux, volatilité constante) : une illustration de la mécanique, pas une prévision.</p></section>';
}
function levOut() {

/* ───────────────────────── tracés (après insertion dans le DOM) ───────────────────────── */
const dateTicks = (xs, n) => { const a = xs[0], b = xs[xs.length - 1]; return Array.from({ length: n }, (_, i) => a + ((b - a) * i) / (n - 1)).map(x => ({ x, label: new Date(x).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', timeZone: 'UTC' }) })); };
const DRAW = {
  perf(el, w, h) {
    const pd = perfData(); if (!pd) return;
    const xs = pd.ser.map(x => PEA.parseISO(x.date).getTime());
    const series = [{ name: 'Mon PEA', color: 'var(--c1)', ys: pd.ser.map(x => x.total), area: true }];
    if (pd.bs) series.push({ name: benchName(pd.bench), color: 'var(--c2)', ys: pd.bs.series.map(x => x.total) });
    drawLine(el, w, h, { xs, label: 'Valeur du PEA', series, xTicks: dateTicks(xs, 3), tipTitle: i => fmt.date(pd.ser[i].date), tipFmt: v => fmt.eur(v, 0) });
  },
  hist(el, w, h) {
    const hs = histSeries(); if (hs.length < 2) return;
    const xs = hs.map(x => PEA.parseISO(x.date).getTime());
    drawLine(el, w, h, { xs, label: 'Valeur et coût d’achat', series: [{ name: 'Valeur des titres', color: 'var(--c1)', ys: hs.map(x => x.value), area: true }, { name: 'Coût d’achat', color: 'var(--c2)', ys: hs.map(x => x.cost) }], xTicks: dateTicks(xs, 4), tipTitle: i => fmt.date(hs[i].date) });
  },
  pos(el, w, h) {
    const p = S.positions.find(x => x.id === el.dataset.id); if (!p) return;
    const hh = p.ticker && H[p.ticker];
    if (!hh || hh.d.length < 2) return;
    const k0 = Math.max(0, hh.d.length - 260), d = hh.d.slice(k0), c = hh.c.slice(k0), xs = d.map(x => PEA.parseISO(x).getTime());
    const series = [{ name: 'Cours', color: 'var(--c1)', ys: c, area: true }];
    if (p.qty > 0 && p.pru > 0) series.push({ name: 'Ton PRU', color: 'var(--c2)', ys: c.map(() => p.pru) });
    drawLine(el, w, h, { xs, label: 'Cours sur un an', series, xTicks: dateTicks(xs, 3), tipTitle: i => fmt.date(d[i]), yTick: v => fmt.n(v, v < 20 ? 1 : 0) + ' €', yFmt: v => fmt.eur(v), tipFmt: v => fmt.eur(v) });
  },
  road(el, w, h) {
    const o = planOpts(), rm = PEA.planRoadmap(S, UI.road, { budget: num(o.budget, 0), startDate: o.date, useCash: o.useCash, mode: o.mode, includeETF: o.includeETF, includeLev: o.includeLev });
    const xs = rm.rows.map(r => r.i), goal = S.settings.divGoal, P = PEA.calcPortfolio(S);
    const ys = [P.divAnnual].concat(rm.rows.map(r => r.divAnnual)), xx = [-1].concat(xs);
    const series = [{ name: 'Dividendes annuels', color: 'var(--c1)', ys, area: true }];
    if (goal > 0 && Math.max(...ys) < goal * 1.6) series.push({ name: 'Objectif', color: 'var(--c2)', ys: ys.map(() => goal) });
    const lab = i => (i < 0 ? 'Aujourd’hui' : fmt.monthYear(rm.rows[i].date));
    const tk = [-1, Math.floor((UI.road - 1) / 2), UI.road - 1].map(i => ({ x: i, label: i < 0 ? 'Auj.' : fmt.monthYear(rm.rows[i].date) }));
    drawLine(el, w, h, { xs: xx, label: 'Dividendes annuels projetés', series, xTicks: tk, tipTitle: i => lab(xx[i]), yTick: v => fmt.n(v, 0) + ' €', yFmt: v => fmt.n(v, 0) + ' €', tipFmt: v => fmt.eur(v, 0) });
  },
  sim(el, w, h) {
    const r = runSim(), real = num(simInputs().infl, 0) > 0;
    const xs = r.rows.map(x => x.year), lastX = xs[xs.length - 1], step = [1, 2, 5, 10].find(k => lastX / k <= 5) || 10;
    const tk = xs.filter(x => x === lastX || (x % step === 0 && lastX - x >= step * 0.6)).map(x => ({ x, label: x === 0 ? 'Auj.' : x + ' ans' }));
    drawLine(el, w, h, { xs, label: 'Projection', series: [{ name: 'Valeur', color: 'var(--c1)', ys: r.rows.map(x => (real ? x.real : x.value)), area: true }, { name: 'Capital versé', color: 'var(--c2)', ys: r.rows.map(x => x.invested) }], xTicks: tk, tipTitle: i => (xs[i] === 0 ? 'Aujourd’hui' : 'Dans ' + xs[i] + ' ans'), tipFmt: v => fmt.eur(v, 0) });
  },
  simdiv(el, w, h) {
    const r = runSim(), real = num(simInputs().infl, 0) > 0, inf = num(simInputs().infl, 0) / 100;
    drawCols(el, w, h, { label: 'Dividendes annuels', items: r.rows.filter(x => x.year > 0).map(x => ({ label: String(x.year), value: real ? x.annualDiv / Math.pow(1 + inf, x.year) : x.annualDiv })), yFmt: v => fmt.n(v, 0) + ' €', hi: null });
  },
};
function drawCharts(root) {

/* — résumé en direct d'un ordre — */
function updateTradeSummary() {
  const root = $('#trade-form'); if (!root) return;
  const f = readForm(root), p = S.positions.find(x => x.id === f.posId), out = $('#tr-sum'), opId = ($('[data-act="saveTrade"]', root) || {}).dataset ? $('[data-act="saveTrade"]', root).dataset.op : '';
  const q = num(f.qty, 0), px = num(f.price, 0), buy = f.side !== 'sell';
  if (!p || !(q > 0) || !(px > 0)) { out.className = 'note'; out.textContent = 'Indique la quantité et le prix pour voir l’effet sur ton PRU et tes espèces.'; return; }
  const gross = q * px, feeIn = num(f.fee, NaN), auto = feeAt(gross, f.date, opId), fe = isFinite(feeIn) ? feeIn : auto;
  const old = opId ? B.ops.find(o => o.id === opId) : null, back = old ? (old.kind === 'buy' ? old.qty * old.price + old.fee : -(old.qty * old.price - old.fee)) : 0;
  const cashAfter = S.cash + back + (buy ? -(gross + fe) : gross - fe);
  let txt = (buy ? 'Débit' : 'Crédit') + ' : <b>' + fmt.eur(gross) + '</b> ' + (buy ? '+' : '−') + ' frais ' + fmt.eur(fe) + (!isFinite(feeIn) && auto === 0 && S.settings.feeModel === 'starter' ? ' (ordre offert du mois)' : '') + '. ';
  if (buy && !old) { const nq = p.qty + q; txt += 'Nouveau PRU : <b>' + fmt.eur((p.qty * p.pru + gross + fe) / nq, 3) + '</b> (' + fmt.n(nq, 0) + ' titres). '; }
  else if (!buy) { txt += 'Plus-value réalisée ≈ <b>' + fmt.eurS((px - p.pru) * q - fe) + '</b>. '; if (!old && q > p.qty + 1e-9) txt += '<br><b class="dn">Tu ne détiens que ' + fmt.n(p.qty, 0) + ' titre(s).</b> '; }
  txt += 'Espèces après : <b class="' + (cashAfter < -0.005 ? 'dn' : '') + '">' + fmt.eur(cashAfter) + '</b>.';
  out.className = 'note' + (cashAfter < -0.005 && buy ? ' warn' : ''); out.innerHTML = txt;
}
function updateHistPreview() {
  const t = $('#hist-text'), out = $('#hist-prev'); if (!t || !out) return;
  const r = PEA.parseHistoryCSV(t.value);
  out.textContent = r.rows.length ? r.rows.length + ' séances lues (' + fmt.date(r.rows[0].date) + ' → ' + fmt.date(r.rows[r.rows.length - 1].date) + ')' + (r.skipped ? ', ' + r.skipped + ' ligne(s) ignorée(s)' : '') + (r.rows.length < 20 ? ' — 20 minimum pour les indicateurs.' : '.') : 'Rien à importer pour l’instant.';
}
function topUp(book, need, date, note) { return need > 0.004 ? L.addOp(book, { kind: 'dep', date, amount: Math.ceil(need * 100) / 100, note }) : book; }

const SAVE = {
  savePrices() {
    const f = readForm(sheetEl()), P = PEA.calcPortfolio(S), upd = {};
    if (!PEA.parseISO(f.date)) return toast('Date invalide.');
    P.groups.forEach(g => { const p = P.pos.find(x => x.id === g.mainId), v = num(f['px-' + p.id], NaN); if (v > 0 && (Math.abs(v - p.price) > 1e-9 || p.priceSrc !== 'manuel')) upd[p.id] = v; });
    const n = Object.keys(upd).length;
    if (!n) { closeSheet(); return toast('Aucun cours modifié.'); }
    commit(withSnapshot(L.setManualPrices(B, upd, f.date).book, f.date)); closeSheet(); toast(n + ' cours enregistré' + (n > 1 ? 's' : ''));
  },
  savePos(el) {
    const f = readForm(sheetEl()), id = el.dataset.id;
    if (!String(f.name).trim()) return toast('Donne un nom à la ligne.');
    const tgt = num(f.target, NaN), old = id ? B.instruments.find(x => x.id === id) : null;
    const obj = Object.assign({}, old || {}, { id: id || PEA.uid(), name: f.name.trim(), short: f.short.trim(), ticker: f.ticker.trim().toUpperCase(), isin: f.isin.trim(), type: f.type, sector: f.sector.trim(), zone: f.zone.trim(), group: f.group.trim(), div: Array.from({ length: 12 }, (_, m) => num(f['d' + m], 0)), divMode: f.divMode, target: isFinite(tgt) ? tgt / 100 : null, buyable: f.buyable, assumed: f.assumed, note: f.note });
    if (f.price !== undefined) { obj.price = num(f.price, 0); obj.priceDate = f.priceDate || (obj.price > 0 ? today() : ''); }
    try {
      let next = L.upsertInstrument(B, obj);
      const oq = num(f.oq, 0), opx = num(f.op, 0);

  saveTrade(el) {

    try {
      let next = B;
      if (opId) next = L.updateOp(next, opId, op);

      commit(opId ? L.updateOp(B, opId, op) : L.addOp(B, op)); closeSheet(); toast(opId ? 'Opération modifiée' : L.KINDS[k].label + ' enregistré' + (k === 'div' || k === 'dep' || k === 'wd' ? '' : 'e'));

  },
  savePlan() {
    const root = $('#plan-form'), f = readForm(root), sh = UI.sheet;
    try {
      const orders = sh.lines.map((l, i) => ({ instr: l.posId, qty: num(f['q' + i], 0), price: num(f['p' + i], 0), fee: num(f['f' + i], 0) })).filter(o => o.qty > 0);
      if (!orders.length) return toast('Aucune quantité à enregistrer.');

      commit(next); closeSheet(); toast(orders.length + ' ordre' + (orders.length > 1 ? 's' : '') + ' enregistré' + (orders.length > 1 ? 's' : ''));

/* le focus (et la saisie en cours) survivent au redessin de l'écran */
function focusSig(el) {
  if (!el || el === document.body || !$('#view').contains(el) || el.type === 'date') return null;
  const d = el.dataset, sig = { sel: null, val: undefined, a: null, b: null };
  if (d.bind) sig.sel = '[data-bind="' + qa(d.bind) + '"]';
  else if (d.act) sig.sel = '[data-act="' + qa(d.act) + '"]' + ['k', 'v', 'id', 'm', 'tab', 'sub'].filter(k => d[k] != null).map(k => '[data-' + k + '="' + qa(d[k]) + '"]').join('');
  if (el.matches && el.matches('input[type=text], input[type=search]')) { sig.val = el.value; try { sig.a = el.selectionStart; sig.b = el.selectionEnd; } catch (e) { /* ok */ } }
  return sig.sel ? sig : null;
}
function restoreSig(sig) {
  if (!sig) return;
  const n = $('#view ' + sig.sel); if (!n) return;
  if (sig.val !== undefined) n.value = sig.val;
  try { n.focus({ preventScroll: true }); if (sig.a != null) n.setSelectionRange(sig.a, sig.b); } catch (e) { /* ok */ }
}

function renderView() {
  const v = $('#view'), y = window.scrollY, sig = focusSig(document.activeElement);
  let html;
  try { html = (VIEWS[UI.tab] || viewAccueil)(); } catch (e) {
    try { console.error(e); } catch (x) { /* ok */ }
    html = '<section class="sec span2"><div class="panel pad empty"><h2>Cet écran n’a pas pu s’afficher</h2><p class="soft">' + esc(e && e.message) + '</p><div class="btns"><button class="btn ghost" data-act="export">Sauvegarder mes données</button><button class="btn ghost" data-act="tab" data-v="accueil">Accueil</button></div></div></section>';
  }
  v.innerHTML = html;
  if (UI.tab === 'outils' && UI.sub === 'levier') levOut();
  drawCharts();
  window.scrollTo(0, y);
  restoreSig(sig);
}
function rerender() {

  setSync(Store.status);
}

function extPrompt(kind, id) {
  const P = PEA.calcPortfolio(S), st = S.settings, t = today();
  const lines = P.groups.map(g => '- ' + g.name + ' (' + PEA.TYPES[g.type] + (g.sector ? ', ' + g.sector : '') + ') : ' + fmt.pct(g.weight, 1) + ' des titres, plus-value ' + fmt.pctS(g.pnlPct, 1) + (g.divAnnual > 0 ? ', dividendes ≈ ' + fmt.eur(g.divAnnual, 0) + '/an (rendement ' + fmt.pct(g.yld, 1) + ')' : '')).join('\n');
  let q = 'Voici mon PEA chez Fortuneo (horizon 10 ans et plus ; objectif : faire grandir mes dividendes, surtout en renforçant mes actions actuelles ; je verse environ ' + fmt.eur(st.monthlyBudget, 0) + ' par mois' + (P.groups.some(g => g.assumed) ? ' ; la forte part de ' + P.groups.filter(g => g.assumed).map(g => g.name).join(' et ') + ' est un choix assumé' : '') + ').\n' +
    'Au ' + fmt.date(t) + ' : valeur ' + fmt.eur(P.total, 0) + ' dont ' + fmt.eur(P.cash, 0) + ' d’espèces, plus-value latente ' + fmt.pctS(P.pnlPct, 1) + ', dividendes estimés ' + fmt.eur(P.divAnnual, 0) + '/an.\nLignes :\n' + lines + '\n\n';
  if (kind === 'achat') {
    const o = planOpts(), plan = currentPlan();
    q += 'Je vais investir ' + fmt.eur(num(o.budget, 0), 0) + ' ce mois-ci. Mon outil de suivi propose : ' + (plan.lines.length ? plan.lines.map(l => l.qty + ' × ' + l.name + ' à ' + fmt.eur(l.price)).join(', ') : 'aucun achat') + '. Qu’en penses-tu ? Donne-moi les arguments pour et contre, et ce que tu regarderais avant de passer l’ordre.';
  } else if (kind === 'risques') q += 'Quels sont les principaux risques de ce portefeuille (concentration, secteurs, ETF à effet de levier, dollar) ? Comment pourrais-je les réduire progressivement sans tout chambouler ?';
  else if (kind === 'ligne') {

  } else q += 'Fais-moi un bilan clair de ce portefeuille : points forts, points faibles, risques principaux, et ce que tu surveillerais ces prochains mois. Donne un avis argumenté et factuel.';

}

/* confirmation en deux touches pour les actions destructrices */
function gate(el) {
  const msg = el.dataset.confirm;
  if (!msg || el.classList.contains('armed')) return true;
  const orig = el.innerHTML, iconOnly = !el.textContent.trim();
  el.classList.add('armed');
  if (iconOnly) toast(msg); else el.textContent = msg;
  clearTimeout(el._t);
  el._t = setTimeout(() => { if (el.isConnected) { el.classList.remove('armed'); el.innerHTML = orig; } }, 3500);
  return false;
}

}

  } else if (root === 'plan') {
    const o = planOpts();
    if (key === 'budget') o.budget = num(raw, 0);
    else if (key === 'date') { if (!PEA.parseISO(raw)) return; o.date = raw; }
    else o[key] = raw;
    if (PLAN_PREFS.includes(key)) saveSettings({ [key]: raw });
    rerender();
  } else if (root === 'ui') {
    if (key === 'mq') { UI.mq = raw; mqTyping(); }
    else if (key === 'wd') { UI.wd = num(raw, 0); wdTyping(); }
  } else if (root === 'set' && final) {
    if (key === 'openDate') saveSettings({ openDate: PEA.parseISO(raw) ? raw : '' }, 'force');
    else if (key === 'feeModel' || key === 'bench') { saveSettings({ [key]: raw }, 'force'); if (key === 'bench' && IS_APP) fetchQuotes(false); }
    else { const v = num(raw, NaN); if (!isFinite(v)) return; saveSettings({ [key]: v }, true); if (key === 'monthlyBudget') { if (UI.plan) UI.plan.budget = v; if (UI.sim) UI.sim.monthly = v; } }
  }
}
const planTyping = debounce(el => { if (el.isConnected) onBind(el, false); }, 260);
const mqTyping = debounce(() => rerender(), 180);
const wdTyping = debounce(() => rerender(), 300);

/* ───────── écouteurs ───────── */
document.addEventListener('click', e => {
  if (e.target.classList && e.target.classList.contains('back')) { closeSheet(); return; }
  const el = e.target.closest && e.target.closest('[data-act]');
  if (!el) return;
  const f = ACT[el.dataset.act];
  if (!f || !gate(el)) return;
  try { f(el, e); } catch (err) { try { console.error(err); } catch (x) { /* ok */ } toast('Action impossible : ' + (err && err.message ? err.message : 'erreur')); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset && el.dataset.bind) {
    const root = el.dataset.bind.split('.')[0];
    if (root === 'sim' || root === 'lev' || root === 'ui') onBind(el, false);
    else if (root === 'plan' && el.type === 'text') planTyping(el);
  }
  if (el.closest && el.closest('#trade-form')) updateTradeSummary();
  if (el.id === 'hist-text') updateHistPreview();
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.bind) {
    const root = el.dataset.bind.split('.')[0];
    if (root === 'plan' && el.type === 'text') { onBind(el, true); }
    else if (root === 'plan' || root === 'set') onBind(el, true);
    else if (root === 'sim' && (el.type === 'checkbox' || el.type === 'range')) onBind(el, true);
  }
  if (el.id === 'imp-file') readImportFile(el);
  if (el.name === 'kind' && el.closest && el.closest('#op-form')) { UI.sheet = { name: 'op', kind: el.value, pick: true }; renderSheet(); return; }
  if (el.closest && el.closest('#trade-form')) {
    if (el.name === 'posId') { const p = S.positions.find(x => x.id === el.value), pr = $('#tr-price'); if (p && pr) pr.value = dec(p.price); }
    updateTradeSummary();
  }
});
document.addEventListener('focusin', e => {
  const el = e.target;
  if (el.name && /^px-/.test(el.name)) setTimeout(() => { try { el.select(); } catch (x) { /* ok */ } }, 0);
});
document.addEventListener('keydown', e => {
  if (!UI.sheet) return;
  const sh = sheetEl();
  if (e.key === 'Escape') { e.preventDefault(); closeSheet(); return; }
  if (!sh) return;
  if (e.key === 'Enter' && e.target.matches && e.target.matches('input.in:not([type=checkbox])')) {
    const fields = $$('input.in, select.in', sh), i = fields.indexOf(e.target);
    e.preventDefault();
    if (i > -1 && i < fields.length - 1 && UI.sheet.name !== 'op') fields[i + 1].focus();
    else { const b = $('.btn.block[data-act^="save"]', sh); if (b) b.click(); }
    return;
  }
  if (e.key === 'Tab') {
    const f = $$('button:not([disabled]), input:not([disabled]), select, textarea, a[href]', sh).filter(x => x.offsetParent !== null);
    if (!f.length) return;
    if (e.shiftKey && (document.activeElement === f[0] || !sh.contains(document.activeElement))) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && (document.activeElement === f[f.length - 1] || !sh.contains(document.activeElement))) { e.preventDefault(); f[0].focus(); }
  }
});
/* infobulles des graphiques : survol (souris) ou glissement (doigt) */
document.addEventListener('pointerdown', chartPointer);
document.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || e.buttons) chartPointer(e); });
document.addEventListener('pointerout', e => {
  const el = e.target.closest && e.target.closest('.chart[data-chart]');
  if (el && e.pointerType === 'mouse' && !el.contains(e.relatedTarget)) hideTip(el);
});
window.addEventListener('resize', debounce(() => drawCharts(), 160));
window.addEventListener('online', () => { if (Store.dirty) queueRemote(true); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (UI.plan && UI.plan.date < today()) UI.plan.date = PEA.nextTradingDay(today());
  if (IS_APP && Date.now() - Quotes.at > 15 * 60 * 1000) fetchQuotes(false);
  else if (!UI.sheet) { refresh(); rerender(); }
});

/* ───────── démarrage ───────── */
function boot() {
  const local = loadLocal();
  if (local) B = local;
  else if (window.__SEED__) { B = L.normalizeBook(window.__SEED__); saveLocal(); }
  if (IS_APP) loadCachedQuotes();
  refresh();
  const hasClaude = FRAMED && window.claude && typeof window.claude.use === 'function';
  UI.booting = !!(hasClaude && !B.instruments.length);
  $('#gear').innerHTML = ic('tools');
  renderTabs(); rerender();
  if (hasClaude) { setupSample(); setTimeout(finishBoot, 12000); }
  connectDb();
  if (IS_APP) {
    fetchQuotes(false);
    if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('./sw.js').catch(() => {}); } catch (e) { /* ok */ } }
  }
}
boot();

})();
</script>
</body>
</html>
