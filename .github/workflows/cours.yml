name: Cours de bourse

on:
  schedule:
    - cron: '20 9,12,15 * * 1-5'   # pendant la séance (heure UTC)
    - cron: '45 16 * * 1-5'        # après la clôture de 17h30 (Paris)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cours
  cancel-in-progress: false

jobs:
  cours:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer
        run: pip install --quiet "yfinance>=0.2.54"
      - name: Récupérer les cours
        run: python scripts/fetch_quotes.py
      - name: Publier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Rien de nouveau"
          else
            git commit -q -m "Cours du $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
